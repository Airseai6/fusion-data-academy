<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>造一台 · 聚变装置设计手记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0E14; --panel:#111720; --amber:#FFB347; --teal:#5BD9BE;
  --rust:#E07A5A; --paper:#F2EDE0; --dim:#7C8798;
  --grid:#1A212B; --line:#263141;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",serif;
  line-height:2.05; letter-spacing:.015em; font-size:17px;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-font-smoothing:antialiased;
}
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,10,14,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:11px 0
}
.topbar-in{
  max-width:680px;margin:0 auto;padding:0 24px;
  display:flex;justify-content:space-between;align-items:center;
  font-family:Consolas,monospace;font-size:12px
}
.tb-title{color:var(--teal);letter-spacing:.05em}
.tb-hud{color:var(--dim);display:flex;gap:14px}
.tb-hud b{color:var(--amber);font-weight:400}

/* 进度条 */
.tb-prog{display:flex;align-items:center;gap:8px;color:var(--dim);
  font-family:Consolas,monospace;font-size:11.5px;white-space:nowrap}
.tb-prog .pips{display:flex;gap:3px}
.tb-prog .pip{width:9px;height:3px;border-radius:2px;background:#26303D;transition:background .3s}
.tb-prog .pip.done{background:var(--teal)}
.tb-prog .pip.now{background:var(--amber);width:16px}

.page{max-width:680px;margin:0 auto;padding:52px 24px 120px}
.scene-head{
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:34px;
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:Consolas,monospace;font-size:12px;color:var(--dim)
}
.scene-head .n{color:var(--amber);letter-spacing:.14em}
.narr{margin-bottom:26px;color:#DCE4F0}
.narr.em{color:var(--paper)}
.narr .hl{color:var(--amber)}
.narr .warn{color:var(--rust)}
.dlg{margin:0 0 26px 0;padding-left:20px;border-left:2px solid #2C3849}
.dlg.me{border-left-color:var(--teal)}
.dlg.chen{border-left-color:var(--amber)}
.dlg.zhou{border-left-color:#8B9DC3}
.dlg .who{
  font-family:Consolas,monospace;font-size:12px;letter-spacing:.1em;
  margin-bottom:5px;color:#8A96A8
}
.dlg.chen .who{color:var(--amber)}
.dlg.me .who{color:var(--teal)}
.dlg.zhou .who{color:#8B9DC3}
.dlg .say{color:var(--paper);font-size:17px}
.dlg .act{font-size:15px;color:#8A96A8;margin-top:8px}
.sys{
  background:#0F1520;border:1px solid var(--line);border-left:2px solid #3A4757;
  padding:14px 18px;margin:0 0 26px;font-family:Consolas,monospace;
  font-size:13px;color:#9AA5B5;line-height:1.85;white-space:pre-wrap
}
.sys b{color:var(--amber);font-weight:400}
.sys .ok{color:var(--teal)}
.sys .bad{color:var(--rust)}
.panel{
  border:1px solid #2E3B4D;background:var(--panel);
  margin:32px 0;border-radius:4px;overflow:hidden
}
.panel-head{
  padding:14px 20px;border-bottom:1px solid #2E3B4D;background:#141C27;
  display:flex;justify-content:space-between;align-items:center;
  font-family:Consolas,monospace;font-size:12px
}
.panel-head .lbl{color:var(--teal);letter-spacing:.12em;font-weight:600}
.panel-head .st{color:#9AA5B5}
.panel-body{padding:20px}
.panel-body p.hint{font-size:15px;color:#B4BECD;margin-bottom:20px;line-height:1.85}
canvas{width:100%;display:block;border-radius:2px}
.ctrl{margin-bottom:20px}
.ctrl:last-child{margin-bottom:0}
.ctrl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.ctrl-name{font-size:15px;color:#DCE4F0;display:flex;align-items:center;gap:7px}
.ctrl-name::before{content:'◀';color:var(--amber);font-size:11px;
  animation:nudge 1.7s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.55}
  50%{transform:translateX(4px);opacity:1}}
.ctrl-val{font-family:Consolas,monospace;font-size:17px;color:var(--amber);font-weight:600}
input[type=range]{
  width:100%;height:6px;-webkit-appearance:none;appearance:none;
  background:#2A3648;border-radius:3px;outline:none;cursor:grab;
  border:1px solid #34425A
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--amber);cursor:grab;border:3px solid var(--panel);
  box-shadow:0 0 0 1px var(--amber),0 0 12px rgba(255,179,71,.35)
}
.readout{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px;background:#2A3648;border:1px solid #2A3648;margin:18px 0;
  border-radius:3px;overflow:hidden
}
.ro{background:#131A24;padding:14px 16px}
.ro-k{font-size:11.5px;color:#8A96A8;font-family:Consolas,monospace;margin-bottom:6px}
.ro-v{font-family:Consolas,monospace;font-size:19px;color:var(--amber);font-weight:600}
.cq{
  border:1px solid #2A3648;border-left:3px solid #4A5768;
  background:#131A24;padding:17px 19px;margin:18px 0;border-radius:3px
}
.cq.good{border-left-color:var(--teal);background:#111E1B}
.cq.warn{border-left-color:var(--amber);background:#1E1A12}
.cq.bad{border-left-color:var(--rust);background:#221512}
.cq-h{display:flex;justify-content:space-between;margin-bottom:10px;
  font-family:Consolas,monospace;font-size:12.5px}
.cq-h .t{color:var(--dim);letter-spacing:.1em}
.cq-h .s.good{color:var(--teal)}.cq-h .s.warn{color:var(--amber)}.cq-h .s.bad{color:var(--rust)}
.bar{height:7px;background:#131B24;border-radius:4px;overflow:hidden;margin-bottom:11px}
.bar span{display:block;height:100%;width:0;transition:width .25s;border-radius:4px}
.cq-t{font-size:15px;color:#C0C9D6;line-height:1.9}
.cq-t b{color:var(--paper)}
.choices{margin:34px 0 0;display:flex;flex-direction:column;gap:11px}
.choice{
  background:#131A24;border:1px solid #2E3B4D;color:var(--paper);
  padding:17px 20px;text-align:left;cursor:pointer;font-family:inherit;
  font-size:16px;line-height:1.7;transition:.15s;border-radius:3px
}
.choice:hover{border-color:var(--amber);color:var(--amber);padding-left:24px}
.choice .sub{display:block;color:var(--dim);font-size:13.5px;margin-top:5px;font-family:Consolas,monospace}
details.deep{
  border:1px solid var(--line);background:#0F1520;margin:30px 0;border-radius:3px
}
details.deep summary{
  cursor:pointer;padding:14px 19px;font-size:13.5px;color:var(--dim);
  list-style:none;user-select:none;display:flex;justify-content:space-between;
  font-family:Consolas,monospace
}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary:hover{color:var(--paper)}
details.deep summary::after{content:"▾";transition:.2s}
details.deep[open] summary::after{transform:rotate(180deg)}
.deep-body{padding:0 21px 21px;border-top:1px solid var(--line);
  font-size:14.5px;color:#A8B2C0;line-height:1.95}
.deep-body h4{font-family:Consolas,monospace;font-size:12px;letter-spacing:.12em;
  color:var(--teal);margin:20px 0 10px;text-transform:uppercase}
.deep-body h4:first-child{margin-top:20px}
.eq{background:#060A0F;border-left:2px solid var(--teal);padding:13px 17px;
  margin:12px 0;font-family:Consolas,monospace;font-size:12.5px;
  color:#DCE4F0;overflow-x:auto;line-height:2;white-space:pre}
.eq .cm{color:var(--dim)}
.ref{font-size:13px;color:#98A2B0;padding:9px 0 9px 15px;
  border-left:1px solid #2A3648;margin-bottom:8px;line-height:1.75}
.ref b{color:#9AA5B1;font-weight:400}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:2px;
  background:#141C26;color:var(--dim);margin-right:6px;font-family:Consolas,monospace}
.tag.cls{background:#1D2620;color:#7FA88E}
.tag.tool{background:#1A1F2B;color:#7C8FB5}
.go{margin:44px 0 0;text-align:center}
.go button{
  background:#131A24;border:1px solid var(--amber);color:var(--amber);
  padding:15px 46px;font-family:Consolas,monospace;font-size:14.5px;
  letter-spacing:.14em;cursor:pointer;transition:.15s;border-radius:3px
}
.go button:hover{background:var(--amber);color:#0A0E14;box-shadow:0 0 20px rgba(255,179,71,.3)}
.go button:disabled{opacity:.35;cursor:not-allowed;border-color:#4A5768;color:#7C8798}
footer{
  max-width:680px;margin:0 auto;padding:0 24px 70px;
  font-family:Consolas,monospace;font-size:11.5px;color:#3A424E;
  border-top:1px solid var(--line);padding-top:22px;margin-top:40px
}

/* ══════════ 结局：设计卡 + 重玩提示 ══════════ */
.go{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.go .btn-share{
  background:var(--teal) !important;color:#08110E !important;
  border:1px solid var(--teal) !important;
  padding:13px 30px;font-size:15px;border-radius:3px;cursor:pointer;
  font-family:inherit;transition:.18s;font-weight:600;letter-spacing:.02em
}
.go .btn-share:hover{background:#7DE8CF !important;box-shadow:0 0 18px rgba(91,217,190,.35)}
.replay-tip{
  margin:30px auto 0;max-width:520px;padding:16px 20px;
  background:var(--panel);border-left:3px solid var(--amber);
  color:#B8C4D4;font-size:14px;line-height:1.85;border-radius:0 3px 3px 0
}

/* ══════════ 移动端适配 ══════════ */
@media (max-width: 720px){
  body{font-size:16px;line-height:1.95;overflow-x:hidden}
  .page{max-width:100%;padding:34px 18px 100px}
  .topbar{padding:9px 0}
  .topbar-in{max-width:100%;padding:0 14px;gap:8px;flex-wrap:nowrap}
  .tb-title{font-size:12.5px;white-space:nowrap}
  .tb-prog{flex:1;min-width:0;justify-content:center}
  .pips{gap:3px}
  .pip{width:7px}
  .tb-step{font-size:11.5px;white-space:nowrap}
  .tb-hud{font-size:11px;gap:7px;white-space:nowrap}
  .tb-hud b{font-size:12px}
  .stage{grid-template-columns:1fr !important}
  .stage canvas{max-width:100%}
  .readout{grid-template-columns:repeat(2,1fr) !important}
  .panel-head{flex-direction:column;align-items:flex-start;gap:6px}
  .ctrl{flex-direction:column;align-items:stretch;gap:6px}
  .ctrl-val{align-self:flex-end}
  .dlg{padding-left:14px;border-left-width:2px}
  .dlg .who{font-size:13px}
  .dlg .say{font-size:15.5px}
  .sys{font-size:12px}
  .scene-head{font-size:11px}
  .choice{padding:12px 14px}
  .go button{padding:13px 28px;font-size:15px}
}
@media (max-width: 420px){
  body{font-size:15.5px}
  .page{padding:28px 14px 90px}
  .tb-title{display:none}
  .tb-step{font-size:11px}
}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <span class="tb-title">造一台</span>
    <span class="tb-prog">
      <span class="pips" id="tb-pips"></span>
      <span id="tb-step">序</span>
    </span>
    <span class="tb-hud">
      R₀ <b id="h-r">—</b>
      B <b id="h-b">—</b>
      Q <b id="h-q">—</b>
    </span>
  </div>
</div>

<div class="page" id="page"></div>

<footer>
  物理依据公开发表文献 · 简化模型在对应幕次的附录中注明<br>
  装置与人物为虚构，量级取自公开数据
</footer>

<script>
/* ══════════════════════════════════════════════════════════════
   设计状态
   ══════════════════════════════════════════════════════════════ */

const D = {
  R0: 3.0,          // 大半径 m
  a: 1.0,           // 小半径 m
  Bt: 5.3,          // 环向场 T
  kappa: 1.7,       // 拉长比
  delta: 0.4,       // 三角形变
  Ip: 8.0,          // 电流 MA
  Pheat: 50,        // 加热 MW
  cost: 0,
  trust: 50,
  flags: {}
};

/* ══════════════════════════════════════════════════════════════
   物理模型（简化但可追溯）
   ══════════════════════════════════════════════════════════════ */

/** 等离子体体积（椭圆截面近似） */
function volume() {
  return 2 * Math.PI * Math.PI * D.R0 * D.a * D.a * D.kappa;
}

/** 等离子体电流：固定 q95 时 I_p ∝ a²·B/R
 *  归一化：R=3.0, a=1.0, B=5.3  →  I_p = 8 MA
 */
function Ip_auto() {
  return 4.53 * (D.a * D.a * D.Bt) / D.R0;
}

/** 经验定标：约束时间（IPB98(y,2)）
 *  τ_E = 0.0562 · I^0.93 · B^0.15 · P^-0.69 · n19^0.41 · M^0.19 · R^1.97 · ε^0.58 · κ^0.78
 *  其中 ε = a/R（反环径比）。注意：没有独立的 a 项。
 */
function tauE() {
  const n19 = 8;
  const P = Math.max(D.Pheat, 5);
  const Ip = Ip_auto();
  const eps = D.a / D.R0;
  return 0.0562
    * Math.pow(Ip, 0.93)
    * Math.pow(D.Bt, 0.15)
    * Math.pow(P, -0.69)
    * Math.pow(n19 / 10, 0.41)
    * Math.pow(2.5, 0.19)              // 氘氚混合，M ≈ 2.5
    * Math.pow(D.R0, 1.97)
    * Math.pow(eps, 0.58)
    * Math.pow(D.kappa, 0.78);
}

/** 三重积 n·T·τ（用简化温度模型） */
function triple() {
  const n = 8e19;
  const T = Te();                        // keV
  return n * T * tauE() / 1e21;          // 10^21 单位
}

/** 密度：受 Greenwald 极限约束，随磁场提升
 *  n_G ∝ I_p / (π a²)，而 I_p ∝ a²B/R  →  简化：n ∝ B
 */
function density() {
  return 8e19 * Math.pow(D.Bt / 5.3, 0.85);
}

/** 电子温度（0D 功率平衡，简化） */
function Te() {
  const P = Math.max(D.Pheat, 5);
  const t = tauE();
  const n = density();
  // 温度随 P·τ/n 提升，但受到辐射损失压制（次线性）
  return 2.0 + 16.0 * Math.pow(Math.max(P * t / (n / 8e19) * 1.0, 0.1) / 30, 0.40);
}

/** 聚变功率（MW）
 *  单位统一：n[m^-3]、⟨σv⟩[m^3/s]、E[J]、V[m^3]  →  W
 */
const E_FUS_J = 17.6 * 1.602e-13;        // 17.6 MeV → 焦耳

function Pfus() {
  const T = Te();
  const n = density();                   // m^-3
  const sv = sigmaV_DT(T) * 1e-6;        // cm³/s → m³/s
  const V = volume();                    // m³
  const P_W = 0.25 * n * n * sv * E_FUS_J * V;
  return P_W / 1e6;                      // W → MW
}

function sigmaV_DT(T) {
  const BG = 34.3827, MRC2 = 1124656;
  const C = [1.17302e-9, 1.51361e-2, 7.51886e-2, 4.60643e-3,
             1.35e-2, -1.0675e-4, 1.366e-5];
  const t = Math.max(T, 0.2);
  const num = t * (C[1] + t * (C[3] + t * C[5]));
  const den = 1 + t * (C[2] + t * (C[4] + t * C[6]));
  const th = t / (1 - num / den);
  const xi = Math.cbrt(BG * BG / (4 * th));
  return C[0] * th * Math.sqrt(xi / (MRC2 * t * t * t)) * Math.exp(-3 * xi);
}

/** Q = P_fus / P_heat */
function Qvalue() {
  return Pfus() / Math.max(D.Pheat, 1);
}

/** 成本（相对值，非线性） */
function costIndex() {
  const magnet = Math.pow(D.Bt / 5.3, 2.2) * Math.pow(D.R0, 0.6) * 40;
  const vessel = Math.pow(volume() / 800, 0.85) * 35;
  const shield = Math.pow(D.a * D.kappa, 1.4) * 6;
  const system = 18;                      // 系统集成（固定）
  return magnet + vessel + shield + system;
}

/** 稳定性裕度（简化：κ 高了不稳，δ 高了改善） */
function margin() {
  return 100 - Math.max(0, (D.kappa - 1.2) * 55) + D.delta * 40;
}

/* ══════════════════════════════════════════════════════════════
   渲染工具
   ══════════════════════════════════════════════════════════════ */

const GRID='#141A22', AXIS='#28323E', DIM='#5A6472';
const AMBER='#FFB347', TEAL='#4EC9B0', RUST='#D2694A', PAPER='#E8E2D4';

function setupCanvas(id, h) {
  const cv = document.getElementById(id);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.getBoundingClientRect().width || 600;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w, h };
}

function grid(ctx, w, h, cols=8, rows=4) {
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  for (let i=1;i<cols;i++){const x=w/cols*i;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for (let i=1;i<rows;i++){const y=h/rows*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
}

const ORDER = ['prologue','act1','act2','act3','act4','act5','act6','act7','act8'];

function hud(currentId) {
  document.getElementById('h-r').textContent = D.R0.toFixed(1) + ' m';
  document.getElementById('h-b').textContent = D.Bt.toFixed(1) + ' T';
  document.getElementById('h-q').textContent = Qvalue().toFixed(2);

  const pips = document.getElementById('tb-pips');
  const step = document.getElementById('tb-step');
  if (pips && currentId) {
    const idx = ORDER.indexOf(currentId);
    pips.innerHTML = ORDER.map((_, i) =>
      i < idx ? '<i class="pip done"></i>' : i === idx ? '<i class="pip now"></i>' : '<i class="pip"></i>'
    ).join('');
    const label = currentId === 'prologue' ? '序' : '第 ' + currentId.replace('act','') + ' 幕';
    step.textContent = label + ' · ' + (idx + 1) + '/' + ORDER.length;
  }
}

/* ══════════════════════════════════════════════════════════════
   场景
   ══════════════════════════════════════════════════════════════ */

const SCENES = {

/* ───────────── 序 ───────────── */
prologue: {
  n: '序', t: '一张白纸',
  render: () => `
    <div class="narr">
      三年后。
    </div>
    <div class="narr">
      你从夜班操作员，做到了实验组的负责人。
      现在你手上有两个博士生、一个真空组的老技工，和一份刚刚批下来的预算。
    </div>
    <div class="narr">
      办公室的门被推开。周工走进来——她是这栋楼里少数几个能把平衡重建、
      材料辐照和中子学一起讲明白的人。
    </div>
    <div class="dlg zhou">
      <div class="who">周工</div>
      <div class="say">「上头批了。」</div>
      <div class="act">她把一沓文件放在你桌上。</div>
      <div class="say">「让我们做一台新装置。目标——」</div>
      <div class="say">「<span class="hl">Q 大于 5</span>。」</div>
    </div>
    <div class="dlg me">
      <div class="who">你</div>
      <div class="say">「……从零开始？」</div>
    </div>
    <div class="dlg zhou">
      <div class="who">周工</div>
      <div class="say">「从零开始。」</div>
      <div class="say">「现有的那台，你已经玩得比谁都熟了。」</div>
      <div class="say">「现在轮到你自己画。」</div>
    </div>
    <div class="narr">
      你翻开那沓文件。第一页是空白的。
      后面几页是参数表——大部分格子也是空的。
    </div>
    <div class="sys">
      设计任务书 · 第 1 版
      ────────────────────────
      目标             <b>Q &gt; 5</b>
      装置类型         托卡马克
      预算             待定（越省越好）
      截止             无明确日期
      负责人           <b>你</b>

const page = document.getElementById('page');

function renderScene(id) {
  const sc = SCENES[id];
  if (!sc) return;
  page.innerHTML = `
    <div class="scene-head">
      <span class="n">${sc.n}</span><span class="t">${sc.t}</span>
    </div>
    ${sc.render()}
  `;
  hud(id);
  window.scrollTo({ top: 0, behavior: 'instant' });

  const btn = page.querySelector('.go button');
  if (btn && sc.next) btn.onclick = () => renderScene(sc.next);

  if (typeof sc.after === 'function') sc.after(sc.next);
  else if (sc.after && typeof window[sc.after] === 'function') window[sc.after](sc.next);
}

/* ══════════════════════════════════════════════════════════════
   交互 1 · 尺寸扫描
   ══════════════════════════════════════════════════════════════ */

function setupSize(nextId) {
  const sr = document.getElementById('r0');
  const sa = document.getElementById('a');
  let cv = null;

  function draw() {
    if (!cv) cv = setupCanvas('cv-size', 280);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 44, padR = 16, padT = 26, padB = 34;
    const pw = w - padL - padR, ph = h - padT - padB;

    // 左：Q vs R₀  右：成本 vs R₀
    const RX = padL + pw * 0.56;

    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph);
    ctx.lineTo(padL + pw * 0.44, padT + ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(RX, padT); ctx.lineTo(RX, padT + ph);
    ctx.lineTo(RX + pw * 0.42, padT + ph); ctx.stroke();

    // Q 曲线
    const savedR = D.R0;
    ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = TEAL;
    let maxQ = 1;
    const qs = [];
    for (let r = 1.2; r <= 5.001; r += 0.05) {
      D.R0 = r;
      const q = Qvalue();
      qs.push([r, q]);
      if (q > maxQ) maxQ = q;
    }
    D.R0 = savedR;
    const QX = r => padL + (r - 1.2) / 3.8 * (pw * 0.44);
    const QY = q => padT + (1 - Math.min(q, maxQ * 1.15) / (maxQ * 1.15)) * ph;
    qs.forEach(([r, q], i) => {
      const x = QX(r), y = QY(q);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 当前点
    const cq0 = Qvalue();
    ctx.beginPath(); ctx.arc(QX(D.R0), QY(cq0), 5.5, 0, Math.PI * 2);
    ctx.fillStyle = cq0 >= 5 ? TEAL : AMBER; ctx.fill();
    ctx.strokeStyle = '#080A0E'; ctx.lineWidth = 2; ctx.stroke();

    ctx.font = '600 11px Consolas,monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = TEAL; ctx.fillText('Q 值', padL + 4, padT + 9);
    ctx.fillStyle = DIM; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('R₀ (m)', padL + pw * 0.22, padT + ph + 18);

    // 成本曲线
    const cs = [];
    let maxC = 1;
    for (let r = 1.2; r <= 5.001; r += 0.05) {
      D.R0 = r;
      const c = costIndex();
      cs.push([r, c]);
      if (c > maxC) maxC = c;
    }
    D.R0 = savedR;
    const CX = r => RX + (r - 1.2) / 3.8 * (pw * 0.42);
    const CY = c => padT + (1 - Math.min(c, maxC * 1.15) / (maxC * 1.15)) * ph;
    ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = RUST;
    cs.forEach(([r, c], i) => {
      const x = CX(r), y = CY(c);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    const cc = costIndex();
    ctx.beginPath(); ctx.arc(CX(D.R0), CY(cc), 5.5, 0, Math.PI * 2);
    ctx.fillStyle = RUST; ctx.fill();
    ctx.strokeStyle = '#080A0E'; ctx.lineWidth = 2; ctx.stroke();

    ctx.font = '600 11px Consolas,monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = RUST; ctx.fillText('成本', RX + 4, padT + 9);
    ctx.fillStyle = DIM; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('R₀ (m)', RX + pw * 0.21, padT + ph + 18);
  }

  function update() {
    D.R0 = parseFloat(sr.value);
    D.a = parseFloat(sa.value);
    document.getElementById('r0-val').textContent = D.R0.toFixed(2) + ' m';
    document.getElementById('a-val').textContent = D.a.toFixed(2) + ' m';

    draw();

    const q = Qvalue(), t = tauE(), c = costIndex(), A = D.R0 / D.a;
    document.getElementById('ro-Q').textContent = q.toFixed(2);
    document.getElementById('ro-Q').style.color = q >= 5 ? TEAL : q >= 3 ? AMBER : RUST;
    document.getElementById('ro-tau').textContent = t.toFixed(2) + ' s';
    document.getElementById('ro-cost').textContent = c.toFixed(0);
    document.getElementById('ro-A').textContent = A.toFixed(2);

    const cq = document.getElementById('size-cq');
    const cs = document.getElementById('size-cq-s');
    const bar = document.getElementById('size-bar');
    const tx = document.getElementById('size-cq-t');
    cq.className = 'cq';
    bar.style.width = Math.min(q / 5 * 100, 100).toFixed(0) + '%';

    if (q >= 5) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '达标';
      bar.style.background = TEAL;
      tx.innerHTML = `Q = <b>${q.toFixed(2)}</b>，目标达成。<br>
        成本指数 <b>${c.toFixed(0)}</b>——记住这个数，后面每次改动都要跟它对比。`;
      const b = document.getElementById('go-act1');
      if (b) setTimeout(() => { b.disabled = false; }, 400);
    } else if (q >= 3) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '还差';
      bar.style.background = AMBER;
      tx.innerHTML = `Q = ${q.toFixed(2)}，不够。<br>
        <span style="color:var(--dim)">装置再大一点——你有这个预算空间。</span>`;
    } else {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '太小';
      bar.style.background = RUST;
      tx.innerHTML = `Q = ${q.toFixed(2)}。这个尺寸撑不起目标。<br>
        <span style="color:var(--dim)">把 R₀ 往上推。</span>`;
    }
  }

  sr.addEventListener('input', update);
  sa.addEventListener('input', update);
  update();
}

/* ══════════════════════════════════════════════════════════════
   交互 2 · 磁场权衡
   ══════════════════════════════════════════════════════════════ */

function setupB(nextId) {
  const sb = document.getElementById('b');
  let cv = null;

  function draw() {
    if (!cv) cv = setupCanvas('cv-b', 270);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 46, padR = 18, padT = 28, padB = 36;
    const pw = w - padL - padR, ph = h - padT - padB;

    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph);
    ctx.lineTo(padL + pw, padT + ph); ctx.stroke();

    // 磁体成本 vs B（超线性）
    const savedB = D.Bt;
    const pts = [];
    let maxC = 1;
    for (let b = 2; b <= 12.001; b += 0.1) {
      D.Bt = b;
      // 磁体成本单独算
      const mc = Math.pow(b / 5.3, 2.2) * 40;
      pts.push([b, mc]);
      if (mc > maxC) maxC = mc;
    }
    D.Bt = savedB;

    const X = b => padL + (b - 2) / 10 * pw;
    const Y = c => padT + (1 - Math.min(c, maxC * 1.1) / (maxC * 1.1)) * ph;

    ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = RUST;
    pts.forEach(([b, c], i) => {
      const x = X(b), y = Y(c);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // LTS / HTS 分界
    const bSplit = 10;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(232,226,212,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(bSplit), padT); ctx.lineTo(X(bSplit), padT + ph);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(232,226,212,.55)';
    ctx.font = '10px Consolas,monospace'; ctx.textAlign = 'center';
    ctx.fillText('LTS 上限', X(bSplit) - 34, padT + 12);
    ctx.fillText('HTS 区间', X(bSplit) + 40, padT + 12);

    // 当前点
    const mc = Math.pow(D.Bt / 5.3, 2.2) * 40;
    ctx.beginPath(); ctx.arc(X(D.Bt), Y(mc), 5.5, 0, Math.PI * 2);
    ctx.fillStyle = D.Bt > 10 ? AMBER : RUST; ctx.fill();
    ctx.strokeStyle = '#080A0E'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = RUST; ctx.font = '600 11px Consolas,monospace';
    ctx.textAlign = 'left'; ctx.fillText('磁体成本', padL + 4, padT + 9);
    ctx.fillStyle = DIM; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('B_t (T)', padL + pw / 2, padT + ph + 18);
  }

  function update() {
    D.Bt = parseFloat(sb.value);
    document.getElementById('b-val').textContent = D.Bt.toFixed(1) + ' T';
    draw();

    const q = Qvalue();
    const mc = Math.pow(D.Bt / 5.3, 2.2) * 40;
    document.getElementById('ro-Q2').textContent = q.toFixed(2);
    document.getElementById('ro-Q2').style.color = q >= 5 ? TEAL : AMBER;
    document.getElementById('ro-mag').textContent = mc.toFixed(0);

    const tech = document.getElementById('ro-tech');
    if (D.Bt <= 10) {
      tech.textContent = '低温超导';
      tech.style.color = TEAL;
    } else {
      tech.textContent = '高温超导';
      tech.style.color = AMBER;
    }

    const cq = document.getElementById('b-cq');
    const cs = document.getElementById('b-cq-s');
    const tx = document.getElementById('b-cq-t');
    cq.className = 'cq';

    if (D.Bt <= 6) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '稳妥';
      tx.innerHTML = `<b>${D.Bt.toFixed(1)} T</b>——成熟区间。<br>
        低温超导绕制工艺成熟，供应链稳定。<br>
        <span style="color:var(--dim)">代价是：装置得造大。</span>`;
    } else if (D.Bt <= 10) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '进取';
      tx.innerHTML = `<b>${D.Bt.toFixed(1)} T</b>——接近低温超导的实用上限。<br>
        磁体成本已经涨到 <b>${mc.toFixed(0)}</b>，绕制精度要求很高。<br>
        <span style="color:var(--dim)">还在常规工艺范围内，但余量不多了。</span>`;
    } else {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '赌注';
      tx.innerHTML = `<b>${D.Bt.toFixed(1)} T</b>——必须用高温超导。<br>
        好处：装置能显著缩小，性能提升。<br>
        代价：磁体成本 <b>${mc.toFixed(0)}</b>，工艺全新，
        而且<span style="color:var(--rust)">这笔赌注无法中途反悔</span>——
        磁体绕完就是这个场强。<br>
        <span style="color:var(--dim)">（这一条路，值得，但要想清楚。）</span>`;
    }
  }

  sb.addEventListener('input', update);
  update();
  const b = document.getElementById('go-act2');
  if (b) setTimeout(() => { b.disabled = false; }, 500);
}

/* ══════════════════════════════════════════════════════════════
   交互 3 · 截面形状（κ / δ）
   ══════════════════════════════════════════════════════════════ */

function setupShape(nextId) {
  const sk = document.getElementById('kp');
  const sd = document.getElementById('dp');
  let cv = null;

  function draw(k, d) {
    if (!cv) cv = setupCanvas('cv-shape', 280);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const cx = w * 0.46, cy = h * 0.5;
    const scale = Math.min(w * 0.30, h * 0.36) / 1.9;

    // 中心柱位置（左）
    ctx.fillStyle = '#1A2430';
    ctx.fillRect(w * 0.06, cy - h * 0.32, 14, h * 0.64);
    ctx.fillStyle = DIM; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('中心柱', w * 0.06 + 7, cy + h * 0.40);

    // 截面（Miller 参数化）
    const R0p = 1.55, ap = 1.0;
    const pts = [];
    for (let th = 0; th <= Math.PI * 2 + 0.01; th += 0.03) {
      const Rr = R0p + ap * Math.cos(th + Math.asin(d) * Math.sin(th));
      const Zz = k * ap * Math.sin(th);
      pts.push([Rr, Zz]);
    }

    // 填充
    ctx.beginPath();
    pts.forEach(([r, z], i) => {
      const x = cx + (r - R0p) * scale * 1.6;
      const y = cy - z * scale * 1.6;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    const grad = ctx.createLinearGradient(cx - 90, cy, cx + 90, cy);
    grad.addColorStop(0, 'rgba(210,105,74,0.16)');
    grad.addColorStop(1, 'rgba(78,201,176,0.14)');
    ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = 2.6; ctx.strokeStyle = TEAL; ctx.stroke();

    // 标注
    ctx.textAlign = 'center'; ctx.font = '10px Consolas,monospace';
    ctx.fillStyle = 'rgba(210,105,74,.75)';
    ctx.fillText('内侧 高场', cx - 100, cy - h * 0.36);
    ctx.fillStyle = 'rgba(78,201,176,.75)';
    ctx.fillText('外侧 低场', cx + 100, cy - h * 0.36);

    ctx.fillStyle = DIM;
    ctx.fillText(`κ = ${k.toFixed(2)}   δ = ${d.toFixed(2)}`,
                 cx, h - 12);
  }

  function update() {
    const k = parseFloat(sk.value);
    const d = parseFloat(sd.value);
    D.kappa = k; D.delta = d;
    document.getElementById('k-val').textContent = k.toFixed(2);
    document.getElementById('d-val').textContent = d.toFixed(2);
    draw(k, d);

    // 垂直裕度：κ 高 → 低；δ 高 → 提升
    let mg = 100 - Math.max(0, (k - 1.05) * 78) + d * 45;
    mg = Math.max(0, Math.min(100, mg));

    // 性能增益：κ 带来收益（次线性）
    const gain = (Math.pow(k, 0.9) - 1) * 42 + d * 12;

    document.getElementById('ro-margin').textContent = mg.toFixed(0) + '%';
    document.getElementById('ro-margin').style.color =
      mg >= 60 ? TEAL : mg >= 35 ? AMBER : RUST;
    document.getElementById('ro-gain').textContent =
      '+' + gain.toFixed(0) + '%';

    const fb = document.getElementById('ro-fb');
    if (k < 1.5) { fb.textContent = '可不装'; fb.style.color = TEAL; }
    else if (k < 1.9) { fb.textContent = '标准反馈'; fb.style.color = AMBER; }
    else { fb.textContent = '高速反馈 <1ms'; fb.style.color = RUST; }

    const cq = document.getElementById('shape-cq');
    const cs = document.getElementById('shape-cq-s');
    const bar = document.getElementById('shape-bar');
    const tx = document.getElementById('shape-cq-t');
    cq.className = 'cq';
    bar.style.width = mg.toFixed(0) + '%';

    if (mg >= 60) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '稳';
      bar.style.background = TEAL;
      tx.innerHTML = `裕度 <b>${mg.toFixed(0)}%</b>，性能增益 +${gain.toFixed(0)}%。<br>
        这是一个健康的形状——反馈系统还能轻松扶住它。`;
      const b = document.getElementById('go-act3');
      if (b) setTimeout(() => { b.disabled = false; }, 400);
    } else if (mg >= 35) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '临界';
      bar.style.background = AMBER;
      tx.innerHTML = `裕度只剩 <b>${mg.toFixed(0)}%</b>。<br>
        性能是拿到了（+${gain.toFixed(0)}%），但反馈系统必须足够快。<br>
        <span style="color:var(--dim)">把 δ 加大一点，能把这个裕度换回来。</span>`;
    } else {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '危险';
      bar.style.background = RUST;
      tx.innerHTML = `裕度 <b>${mg.toFixed(0)}%</b>——太扁了。<br>
        它会自己翻过来。你需要毫秒级的反馈，而且一旦失败就是撞壁。<br>
        <span style="color:var(--dim)">要么降 κ，要么加 δ。</span>`;
    }
  }

  sk.addEventListener('input', update);
  sd.addEventListener('input', update);
  update();
}

/* ══════════════════════════════════════════════════════════════
   交互 4 · 加热系统配置
   ══════════════════════════════════════════════════════════════ */

function setupHeat2(nextId) {
  const sO = document.getElementById('h-ohm');
  const sR = document.getElementById('h-rf');
  const sN = document.getElementById('h-nbi');
  let cv = null, solved = false;

  function solveT(pO, pR, pN) {
    D.Pheat = Math.max(pO + pR + pN, 1);
    let T = 5;
    for (let i = 0; i < 80; i++) {
      const ohmEff = pO * Math.exp(-T / 7.5);
      const P = ohmEff + pR + pN;
      const t = tauE();
      const n = density();
      const Tn = 2.0 + 16.0 * Math.pow(Math.max(P * t / (n / 8e19), 0.1) / 30, 0.40);
      T = T + 0.3 * (Tn - T);
      if (Math.abs(Tn - T) < 0.002) break;
    }
    return T;
  }

  function draw(pO, pR, pN, T) {
    if (!cv) cv = setupCanvas('cv-heat2', 250);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 30, padR = 16, padT = 30, padB = 52;
    const pw = w - padL - padR, ph = h - padT - padB;

    // 温度柱
    const frac = Math.min(T / 12, 1.3);
    const col = T >= 12 ? TEAL : T >= 8 ? AMBER : RUST;
    const barY = padT + ph * 0.22;

    ctx.fillStyle = '#131B24';
    ctx.fillRect(padL, barY, pw, 30);

    // 目标线
    const tgtX = padL + pw * (12 / 12 / 1.3);
    ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tgtX, barY - 18);
    ctx.lineTo(tgtX, barY + 46); ctx.stroke();
    ctx.fillStyle = PAPER; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('目标 12 keV', tgtX, barY - 24);

    ctx.fillStyle = col;
    ctx.fillRect(padL, barY, Math.min(frac, 1.3) * pw, 30);
    ctx.textAlign = 'left'; ctx.font = '600 14px Consolas,monospace';
    ctx.fillStyle = col;
    ctx.fillText(T.toFixed(2) + ' keV', padL + 8, barY + 21);

    // 三种加热的堆叠
    const ohmEff = pO * Math.exp(-T / 7.5);
    const items = [['欧姆', ohmEff, RUST], ['射频', pR, AMBER], ['中性束', pN, TEAL]];
    const total = ohmEff + pR + pN;
    const maxP = Math.max(total, 60);
    let acc = padL;
    items.forEach(([l, v, c]) => {
      const bw = v / maxP * pw;
      ctx.fillStyle = c; ctx.fillRect(acc, barY + 48, bw, 14);
      acc += bw;
    });
    ctx.font = '10px Consolas,monospace'; ctx.textAlign = 'left';
    let lx = padL;
    items.forEach(([l, v, c]) => {
      if (v > 0.5) {
        ctx.fillStyle = c;
        ctx.fillText(`${l} ${v.toFixed(1)}`, lx + 2, barY + 82);
        lx += pw / 3;
      }
    });
    ctx.fillStyle = DIM;
    ctx.fillText(`有效总功率 ${total.toFixed(1)} MW`, padL, barY + 102);

    ctx.fillStyle = RUST; ctx.font = '600 11px Consolas,monospace';
    ctx.fillText(`欧姆效率 ${(Math.exp(-T / 7.5) * 100).toFixed(0)}%`, padL, padT + 8);
  }

  function hcost(pO, pR, pN) {
    return pO * 1 + pR * 20 + pN * 32;      // 相对造价
  }

  function update() {
    const pO = parseInt(sO.value, 10);
    const pR = parseInt(sR.value, 10);
    const pN = parseInt(sN.value, 10);

    document.getElementById('h-ohm-v').textContent = pO + ' MW';
    document.getElementById('h-rf-v').textContent = pR + ' MW';
    document.getElementById('h-nbi-v').textContent = pN + ' MW';

    const T = solveT(pO, pR, pN);
    draw(pO, pR, pN, T);

    const Q = Qvalue();
    document.getElementById('ro-T2').textContent = T.toFixed(2) + ' keV';
    document.getElementById('ro-T2').style.color = T >= 12 ? TEAL : T >= 8 ? AMBER : RUST;
    document.getElementById('ro-Q3').textContent = Q.toFixed(2);
    document.getElementById('ro-Q3').style.color = Q >= 5 ? TEAL : AMBER;

    const hc = hcost(pO, pR, pN);
    document.getElementById('ro-hcost').textContent = hc.toFixed(0);

    const cq = document.getElementById('heat2-cq');
    const cs = document.getElementById('heat2-cq-s');
    const tx = document.getElementById('heat2-cq-t');
    cq.className = 'cq';

    if (T >= 12) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '达标';
      tx.innerHTML = `温度 <b>${T.toFixed(2)} keV</b>，Q = <b>${Q.toFixed(2)}</b>。<br>
        加热系统相对造价 <b>${hc.toFixed(0)}</b>。<br>
        <span style="color:var(--dim)">注意欧姆那一栏几乎不花钱——但它贡献有限。</span>`;
      if (!solved) {
        solved = true;
        const b = document.getElementById('go-act4');
        if (b) setTimeout(() => { b.disabled = false; }, 500);
      }
    } else if (T >= 8) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '还不够';
      tx.innerHTML = `温度 ${T.toFixed(2)} keV。方向对，但离目标还差。<br>
        <span style="color:var(--dim)">注意：光靠欧姆是上不去的——它有天花板。</span>`;
    } else {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '太低';
      tx.innerHTML = `温度只有 ${T.toFixed(2)} keV。<br>
        欧姆加热的效率已经掉到 ${(Math.exp(-T / 7.5) * 100).toFixed(0)}%。<br>
        <span style="color:var(--dim)">把射频和中性束加上去。</span>`;
    }
  }

  [sO, sR, sN].forEach(s => s.addEventListener('input', update));
  update();
}

/* ══════════════════════════════════════════════════════════════
   交互 5 · 第一壁材料配置
   ══════════════════════════════════════════════════════════════ */

function setupWall(nextId) {
  const sw = document.getElementById('wfrac');
  let cv = null;

  function calc(f) {                       // f: 钨比例 0–1
    // 性能损失：钨溅射 → 高 Z 杂质 → 辐射损失（超线性）
    const perf = 12.5 * Math.pow(f, 1.7);
    // 寿命（年）：钨越多久用
    const life = 0.6 + 4.2 * f;
    // 年维护量（次/年）
    const maint = 1 / life;
    return { perf, life, maint };
  }

  function draw(f) {
    if (!cv) cv = setupCanvas('cv-wall', 270);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 46, padR = 18, padT = 28, padB = 36;
    const pw = w - padL - padR, ph = h - padT - padB;

    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph);
    ctx.lineTo(padL + pw, padT + ph); ctx.stroke();

    const X = v => padL + v * pw;

    // 下区：寿命（归一化到 0-5 年）
    const LX = v => padL + v * pw * 0.48;
    const LY = yr => padT + ph - Math.min(yr / 5, 1) * ph * 0.44;

    // 上区：性能损失（0-15%）
    const PX = v => padL + pw * 0.52 + v * pw * 0.48;
    const PY = p => padT + ph * 0.42 - Math.min(p / 15, 1) * ph * 0.36;

    // 寿命曲线
    ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = TEAL;
    for (let i = 0; i <= 100; i++) {
      const v = i / 100;
      const { life } = calc(v);
      const x = LX(v), y = LY(life);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.font = '600 11px Consolas,monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = TEAL; ctx.fillText('寿命（年）', padL + 4, padT + 9);

    // 性能损失曲线
    ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = RUST;
    for (let i = 0; i <= 100; i++) {
      const v = i / 100;
      const { perf } = calc(v);
      const x = PX(v), y = PY(perf);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = RUST; ctx.fillText('性能损失（%）', padL + pw * 0.52 + 4, padT + 9);

    // 当前点
    const { perf, life } = calc(f);
    ctx.beginPath(); ctx.arc(LX(f), LY(life), 5.5, 0, Math.PI * 2);
    ctx.fillStyle = TEAL; ctx.fill();
    ctx.strokeStyle = '#080A0E'; ctx.lineWidth = 2; ctx.stroke();

    ctx.beginPath(); ctx.arc(PX(f), PY(perf), 5.5, 0, Math.PI * 2);
    ctx.fillStyle = RUST; ctx.fill(); ctx.stroke();

    // 目标线（性能损失 8%）
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(232,226,212,.30)'; ctx.lineWidth = 1;
    const y8 = PY(8);
    ctx.beginPath(); ctx.moveTo(padL + pw * 0.52, y8);
    ctx.lineTo(padL + pw, y8); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(232,226,212,.55)';
    ctx.font = '10px Consolas,monospace'; ctx.textAlign = 'right';
    ctx.fillText('8% 上限', padL + pw - 2, y8 - 5);

    ctx.fillStyle = DIM; ctx.textAlign = 'center';
    ctx.fillText('钨比例 0% → 100%（碳 → 全钨）', padL + pw / 2, h - 10);
  }

  function update() {
    const f = parseInt(sw.value, 10) / 100;
    document.getElementById('w-val').textContent = (f * 100).toFixed(0) + '%';
    draw(f);

    const { perf, life, maint } = calc(f);
    const pe = document.getElementById('ro-perf');
    pe.textContent = '−' + perf.toFixed(1) + '%';
    pe.style.color = perf <= 8 ? TEAL : perf <= 11 ? AMBER : RUST;

    const le = document.getElementById('ro-life');
    le.textContent = life.toFixed(1) + ' 年';
    le.style.color = life >= 2 ? TEAL : AMBER;

    document.getElementById('ro-maint').textContent = maint.toFixed(2) + ' 次/年';

    const cq = document.getElementById('wall-cq');
    const cs = document.getElementById('wall-cq-s');
    const tx = document.getElementById('wall-cq-t');
    cq.className = 'cq';

    if (perf <= 8 && life >= 2) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '平衡';
      tx.innerHTML = `性能损失 <b>${perf.toFixed(1)}%</b>，寿命 <b>${life.toFixed(1)} 年</b>。<br>
        两边都在可接受范围内——这是个工程上说得过去的选择。`;
      const b = document.getElementById('go-act5');
      if (b) setTimeout(() => { b.disabled = false; }, 400);
    } else if (perf > 11) {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '太脏';
      tx.innerHTML = `性能损失 <b>${perf.toFixed(1)}%</b>——钨太多了。<br>
        溅射出来的高 Z 杂质在疯狂辐射，你辛苦加热的功率正在被它吃掉。<br>
        <span style="color:var(--dim)">减一点钨，让碳分担一些。</span>`;
    } else if (life < 2) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '不耐用';
      tx.innerHTML = `寿命只有 <b>${life.toFixed(1)} 年</b>，一年要换 <b>${maint.toFixed(2)}</b> 次。<br>
        性能是保住了，但停机维护的时间成本很高——
        而且换壁意味着<b>放射性环境下的遥操作</b>。`;
    } else {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '接近上限';
      tx.innerHTML = `性能损失 ${perf.toFixed(1)}%，寿命 ${life.toFixed(1)} 年。<br>
        能过，但余量不大。<br>
        <span style="color:var(--dim)">注意那条 8% 的红线。</span>`;
    }
  }

  sw.addEventListener('input', update);
  update();
}

/* ══════════════════════════════════════════════════════════════
   交互 6 · 偏滤器与脱靶
   ══════════════════════════════════════════════════════════════ */

function setupDiv(nextId) {
  const sa = document.getElementById('ang');
  const sd = document.getElementById('detach');
  let cv = null, solved = false;

  const P_SOL = 20;                        // 排气功率 MW

  function calc(angDeg, detach) {
    // 掠射角：靶板与磁力线的夹角。角度越小 → 投影面积越大 → 热流越低
    const alpha = Math.max(angDeg, 0.3) * Math.PI / 180;
    // 热流展宽随角度略增（掠射时更宽）
    const lam = 0.0015 + 0.0055 * Math.sin(Math.min(alpha * 3.2, Math.PI / 2));
    // 脱靶削减：辐射掉一部分能量
    const fRad = 1 - 0.82 * Math.pow(detach / 100, 1.35);
    // q = P/(2πR·λ) · sin(α)
    const q = (P_SOL * fRad * 1e6) / (2 * Math.PI * D.R0 * lam) * Math.sin(alpha);
    return { q: q / 1e6, lam, fRad, alpha };   // MW/m²
  }

  function draw(angDeg, detach) {
    if (!cv) cv = setupCanvas('cv-div', 270);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 44, padR = 18, padT = 30, padB = 40;
    const pw = w - padL - padR, ph = h - padT - padB;

    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph);
    ctx.lineTo(padL + pw, padT + ph); ctx.stroke();

    const X = s => padL + s / 100 * pw;          // 到靶板的距离（任意单位）
    const QMAX = 40;
    const Y = q => padT + (1 - Math.min(q, QMAX) / QMAX) * ph;

    const { q, lam, fRad } = calc(angDeg, detach);

    // 热流剖面（高斯型，宽度随 λ 变化）
    ctx.beginPath(); ctx.lineWidth = 2.6;
    const col = q < 10 ? TEAL : q < 25 ? AMBER : RUST;
    ctx.strokeStyle = col;
    const sigma = 6 + lam * 2600;
    for (let s = 0; s <= 100; s += 0.5) {
      const val = q * Math.exp(-Math.pow((s - 58) / sigma, 2));
      const x = X(s), y = Y(val);
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 10 MW/m² 安全线
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(78,201,176,.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, Y(10)); ctx.lineTo(padL + pw, Y(10)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(78,201,176,.75)';
    ctx.font = '10px Consolas,monospace'; ctx.textAlign = 'left';
    ctx.fillText('10 MW/m² 材料上限', padL + 5, Y(10) - 5);

    // 刻度
    ctx.fillStyle = DIM; ctx.textAlign = 'right';
    [0, 20, 40, 60].forEach(v => ctx.fillText(v, padL - 6, Y(v) + 3));
    ctx.textAlign = 'center';
    ctx.fillText('沿靶板的位置', padL + pw / 2, h - 10);

    // 峰值标注
    ctx.textAlign = 'left'; ctx.font = '600 11px Consolas,monospace';
    ctx.fillStyle = col;
    ctx.fillText(`峰值 ${q.toFixed(1)} MW/m²`, padL + 5, padT + 9);

    ctx.fillStyle = DIM; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'right';
    ctx.fillText(detach > 55 ? '已脱靶' : '未脱靶', padL + pw - 3, padT + 9);
  }

  function update() {
    const ang = parseFloat(sa.value);
    const det = parseInt(sd.value, 10);
    document.getElementById('ang-val').textContent = ang.toFixed(1) + '°';
    document.getElementById('det-val').textContent = det + '%';
    draw(ang, det);

    const { q, lam } = calc(ang, det);

    const hf = document.getElementById('ro-hf');
    hf.textContent = q.toFixed(1) + ' MW/m²';
    hf.style.color = q < 10 ? TEAL : q < 25 ? AMBER : RUST;

    document.getElementById('ro-lam').textContent = (lam * 1000).toFixed(1) + ' mm';

    const dt = document.getElementById('ro-det');
    if (det > 55) { dt.textContent = '已脱靶'; dt.style.color = TEAL; }
    else if (det > 25) { dt.textContent = '部分脱靶'; dt.style.color = AMBER; }
    else { dt.textContent = '未脱靶'; dt.style.color = RUST; }

    const cq = document.getElementById('div-cq');
    const cs = document.getElementById('div-cq-s');
    const tx = document.getElementById('div-cq-t');
    cq.className = 'cq';

    if (q < 10) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '安全';
      tx.innerHTML = `峰值热流 <b>${q.toFixed(1)} MW/m²</b>——低于材料上限。<br>
        展宽 <b>${(lam*1000).toFixed(1)} mm</b>，脱靶状态：${det > 55 ? '已进入' : '尚未进入'}。<br>
        <span style="color:var(--dim)">这条路线可行。</span>`;
      if (!solved) {
        solved = true;
        const b = document.getElementById('go-act6');
        if (b) setTimeout(() => { b.disabled = false; }, 500);
      }
    } else if (q < 25) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '偏高';
      tx.innerHTML = `峰值热流 <b>${q.toFixed(1)} MW/m²</b>——还是太高。<br>
        <span style="color:var(--dim)">把掠射角再压小一点（更斜），或者提高脱靶强度。</span>`;
    } else {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '烧穿';
      tx.innerHTML = `峰值热流 <b>${q.toFixed(1)} MW/m²</b>——远超材料上限。<br>
        靶板上的那块钨会在几秒钟内被蒸发。<br>
        <span style="color:var(--dim)">要么把热流摊开（减小掠射角），要么让它脱靶。</span>`;
    }
  }

  sa.addEventListener('input', update);
  sd.addEventListener('input', update);
  update();
}

/* ══════════════════════════════════════════════════════════════
   交互 7 · 成本分解
   ══════════════════════════════════════════════════════════════ */

function setupBudget(nextId) {
  let cv = null;

  function parts() {
    const magnet = Math.pow(D.Bt / 5.3, 2.2) * Math.pow(D.R0, 0.6) * 40;
    const vessel = Math.pow(volume() / 800, 0.85) * 35;
    const shield = Math.pow(D.a * D.kappa, 1.4) * 6;
    const system = 18;
    return [
      ['磁体系统', magnet, '#D2694A'],
      ['真空室', vessel, '#FFB347'],
      ['屏蔽层', shield, '#8B9DC3'],
      ['系统集成', system, '#4EC9B0'],
    ];
  }

  function draw() {
    if (!cv) cv = setupCanvas('cv-budget', 250);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 30, padR = 20, padT = 34, padB = 48;
    const pw = w - padL - padR;

    const ps = parts();
    const total = ps.reduce((s, [, v]) => s + v, 0);

    // 堆叠横条
    const barY = padT + 20;
    const barH = 36;
    let acc = padL;
    ps.forEach(([, v, c]) => {
      const bw = v / total * pw;
      ctx.fillStyle = c;
      ctx.fillRect(acc, barY, bw, barH);
      acc += bw;
    });

    // 总成本标注
    ctx.fillStyle = PAPER;
    ctx.font = '600 13px Consolas,monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`总成本指数 ${total.toFixed(0)}`, padL, padT);
    ctx.textAlign = 'right';
    ctx.fillStyle = DIM;
    ctx.font = '11px Consolas,monospace';
    ctx.fillText('（相对值）', padL + pw, padT);

    // 图例
    ctx.font = '11px Consolas,monospace';
    let ly = barY + barH + 34;
    ps.forEach(([name, v, c], i) => {
      const pct = (v / total * 100);
      ctx.fillStyle = c;
      ctx.fillRect(padL, ly - 9, 10, 10);
      ctx.fillStyle = PAPER;
      ctx.textAlign = 'left';
      ctx.fillText(`${name}`, padL + 18, ly);
      ctx.fillStyle = DIM;
      ctx.fillText(`${v.toFixed(0)}  (${pct.toFixed(0)}%)`, padL + 130, ly);
      if (i % 2 === 1) ly += 26;
    });
    // 第二列
    ly = barY + barH + 34;
    ps.forEach(([name, v, c], i) => {
      if (i % 2 === 0) return;
      // 已在上面处理
    });
  }

  draw();
  const b = document.getElementById('go-act7');
  if (b) setTimeout(() => { b.disabled = false; }, 500);
}

renderScene('prologue');
</script>
