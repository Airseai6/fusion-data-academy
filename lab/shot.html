<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>第一次放电 · 托卡马克值班日志</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0E14; --panel:#111720; --amber:#FFB347; --teal:#5BD9BE;
  --rust:#E07A5A; --paper:#F2EDE0; --dim:#7C8798;
  --grid:#1A212B; --line:#263141;
}
html{scroll-behavior:smooth}

body{
  background:var(--bg); color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",serif;
  line-height:2.05; letter-spacing:.015em; font-size:17px;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-font-smoothing:antialiased;
}

/* ══════════ 顶部状态栏 + 进度 ══════════ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(10,14,20,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:11px 0
}
.topbar-in{
  max-width:680px;margin:0 auto;padding:0 24px;
  display:flex;justify-content:space-between;align-items:center;
  font-family:"Consolas",monospace;font-size:12px;gap:12px
}
.tb-title{color:var(--teal);letter-spacing:.05em;white-space:nowrap}
.tb-hud{color:var(--dim);display:flex;gap:14px;white-space:nowrap}
.tb-hud b{color:var(--amber);font-weight:400}

/* 进度条 */
.tb-prog{
  display:flex;align-items:center;gap:8px;color:var(--dim);
  font-family:Consolas,monospace;font-size:11.5px;white-space:nowrap
}
.tb-prog .pips{display:flex;gap:3px}
.tb-prog .pip{
  width:9px;height:3px;border-radius:2px;background:#26303D;
  transition:background .3s
}
.tb-prog .pip.done{background:var(--teal)}
.tb-prog .pip.now{background:var(--amber);width:16px}

/* ══════════ 正文容器 ══════════ */
.page{max-width:680px;margin:0 auto;padding:52px 24px 120px}

/* ══════════ 场景头 ══════════ */
.scene-head{
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:34px;
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:"Consolas",monospace;font-size:12px;color:var(--dim)
}
.scene-head .n{color:var(--amber);letter-spacing:.14em}
.scene-head .t{color:var(--dim)}

/* ══════════ 叙事段落 ══════════ */
.narr{margin-bottom:26px;color:#DCE4F0}
.narr.em{color:var(--paper)}
.narr .hl{color:var(--amber)}
.narr .warn{color:var(--rust)}

/* ══════════ 对话 ══════════ */
.dlg{margin:0 0 26px 0;padding-left:20px;border-left:2px solid #2C3849}
.dlg.me{border-left-color:var(--teal)}
.dlg.chen{border-left-color:var(--amber)}
.dlg .who{
  font-family:"Consolas",monospace;font-size:12px;letter-spacing:.1em;
  margin-bottom:5px;color:#8A96A8
}
.dlg.chen .who{color:var(--amber)}
.dlg.me .who{color:var(--teal)}
.dlg .say{color:var(--paper);font-size:17px}
.dlg .say .quiet{color:#9AA5B5}
.dlg .act{font-size:15px;color:#8A96A8;font-style:normal;margin-top:8px}

/* ══════════ 系统 / 日志 ══════════ */
.sys{
  background:#0F1520;border:1px solid var(--line);border-left:2px solid #3A4757;
  padding:14px 18px;margin:0 0 26px;font-family:"Consolas",monospace;
  font-size:13px;color:#9AA5B5;line-height:1.85;white-space:pre-wrap
}
.sys b{color:var(--amber);font-weight:400}
.sys .ok{color:var(--teal)}
.sys .bad{color:var(--rust)}

/* ══════════ 交互面板 ★ ══════════ */
.panel{
  border:1px solid #2E3B4D;background:var(--panel);
  margin:32px 0;border-radius:4px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset
}
.panel-head{
  padding:14px 20px;border-bottom:1px solid #2E3B4D;
  background:#141C27;
  display:flex;justify-content:space-between;align-items:center;
  font-family:"Consolas",monospace;font-size:12.5px
}
.panel-head .lbl{color:var(--teal);letter-spacing:.12em;font-weight:600}
.panel-head .st{color:#9AA5B5}
.panel-body{padding:22px}
.panel-body p.hint{font-size:15px;color:#B4BECD;margin-bottom:20px;line-height:1.85}
canvas{width:100%;display:block;border-radius:3px}

/* 通道网格（交互 1） */
.coils{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.coil{
  background:#0F1520;border:1px solid #2A3648;border-radius:3px;
  padding:12px 10px;text-align:center;cursor:pointer;transition:.15s
}
.coil:hover{border-color:var(--amber);background:#18202C}
.coil.picked{border-color:var(--teal);background:#12251F}
.coil.wrong{border-color:var(--rust);background:#26140F}
.coil .id{font-family:Consolas,monospace;font-size:11px;color:#8A96A8;margin-bottom:5px}
.coil .val{font-family:Consolas,monospace;font-size:15px;color:var(--paper)}
.coil .dv{font-family:Consolas,monospace;font-size:11px;color:#8A96A8;margin-top:3px}
.coil.flagged .dv{color:var(--rust)}

/* 滑块 —— 更醒目 */
.ctrl{margin-bottom:24px}
.ctrl:last-child{margin-bottom:0}
.ctrl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.ctrl-name{font-size:15px;color:#DCE4F0;display:flex;align-items:center;gap:7px}
.ctrl-name::before{
  content:'◀';color:var(--amber);font-size:11px;
  animation:nudge 1.7s ease-in-out infinite
}
@keyframes nudge{
  0%,100%{transform:translateX(0);opacity:.55}
  50%{transform:translateX(4px);opacity:1}
}
.ctrl-val{font-family:Consolas,monospace;font-size:17px;color:var(--amber);font-weight:600}
input[type=range]{
  width:100%;height:6px;-webkit-appearance:none;appearance:none;
  background:#2A3648;border-radius:3px;outline:none;cursor:grab;
  border:1px solid #34425A
}
input[type=range]:active{cursor:grabbing}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--amber);cursor:grab;border:3px solid var(--panel);
  box-shadow:0 0 0 1px var(--amber),0 0 12px rgba(255,179,71,.35)
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--amber);
  cursor:grab;border:3px solid var(--panel);
  box-shadow:0 0 0 1px var(--amber),0 0 12px rgba(255,179,71,.35)
}
.ctrl-hint{font-size:13px;color:#8A96A8;margin-top:8px;line-height:1.7}

/* ══════════ 读数 ══════════ */
.readout{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px;background:#2A3648;border:1px solid #2A3648;margin:18px 0;border-radius:3px;
  overflow:hidden
}
.ro{background:#131A24;padding:14px 16px}
.ro-k{font-size:11.5px;color:#8A96A8;font-family:Consolas,monospace;margin-bottom:6px}
.ro-v{font-family:Consolas,monospace;font-size:19px;color:var(--amber);font-weight:600}

/* ══════════ 后果条 ══════════ */
.cq{
  border:1px solid #2A3648;border-left:3px solid #4A5768;
  background:#131A24;padding:17px 19px;margin:18px 0;border-radius:3px
}
.cq.good{border-left-color:var(--teal);background:#111E1B}
.cq.warn{border-left-color:var(--amber);background:#1E1A12}
.cq.bad{border-left-color:var(--rust);background:#221512}
.cq-h{display:flex;justify-content:space-between;margin-bottom:11px;
  font-family:Consolas,monospace;font-size:13px}
.cq-h .t{color:#9AA5B5;letter-spacing:.1em}
.cq-h .s.good{color:var(--teal);font-weight:600}
.cq-h .s.warn{color:var(--amber);font-weight:600}
.cq-h .s.bad{color:var(--rust);font-weight:600}
.bar{height:8px;background:#1E2733;border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar span{display:block;height:100%;width:0;transition:width .25s;border-radius:4px}
.cq-t{font-size:15px;color:#C0C9D6;line-height:1.9}
.cq-t b{color:var(--paper);font-weight:600}

/* ══════════ 选择 ══════════ */
.choices{margin:34px 0 0;display:flex;flex-direction:column;gap:11px}
.choice{
  background:#131A24;border:1px solid #2E3B4D;color:var(--paper);
  padding:17px 20px;text-align:left;cursor:pointer;font-family:inherit;
  font-size:16px;line-height:1.7;transition:.15s;border-radius:3px
}
.choice:hover{border-color:var(--amber);color:var(--amber);padding-left:25px;background:#1A2230}
.choice .sub{display:block;color:#8A96A8;font-size:13.5px;margin-top:6px;font-family:Consolas,monospace}

/* ══════════ 附录 ══════════ */
details.deep{
  border:1px solid var(--line);background:#0F1520;margin:30px 0;border-radius:3px
}
details.deep summary{
  cursor:pointer;padding:15px 19px;font-size:14px;color:#9AA5B5;
  list-style:none;user-select:none;display:flex;justify-content:space-between;
  font-family:Consolas,monospace
}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary:hover{color:var(--paper)}
details.deep summary::after{content:"▾";transition:.2s}
details.deep[open] summary::after{transform:rotate(180deg)}
.deep-body{padding:0 21px 21px;border-top:1px solid var(--line);
  font-size:14.5px;color:#A8B2C0;line-height:1.95}
.deep-body h4{font-family:Consolas,monospace;font-size:12px;letter-spacing:.12em;
  color:var(--teal);margin:20px 0 10px;text-transform:uppercase}
.deep-body h4:first-child{margin-top:20px}
.deep-body p{margin-bottom:12px}
.deep-body b{color:var(--paper);font-weight:600}
.eq{background:#0A0F16;border-left:2px solid var(--teal);padding:14px 18px;
  margin:12px 0;font-family:Consolas,monospace;font-size:12.5px;
  color:#DCE4F0;overflow-x:auto;line-height:2;white-space:pre;border-radius:0 3px 3px 0}
.eq .cm{color:#7C8798}
.ref{font-size:13px;color:#98A2B0;padding:9px 0 9px 15px;
  border-left:1px solid #2A3648;margin-bottom:8px;line-height:1.75}
.ref b{color:#B4BECD;font-weight:400}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:2px;
  background:#1A212B;color:#8A96A8;margin-right:6px;font-family:Consolas,monospace}
.tag.cls{background:#16221C;color:#7FA88E}
.tag.tool{background:#161E2B;color:#7C8FB5}

/* ══════════ 继续按钮 ══════════ */
.go{margin:44px 0 0;text-align:center}
.go button{
  background:#131A24;border:1px solid var(--amber);color:var(--amber);
  padding:15px 46px;font-family:Consolas,monospace;font-size:14.5px;
  letter-spacing:.14em;cursor:pointer;transition:.15s;border-radius:3px
}
.go button:hover{background:var(--amber);color:#0A0E14;box-shadow:0 0 20px rgba(255,179,71,.3)}
.go button:disabled{opacity:.35;cursor:not-allowed;border-color:#4A5768;color:#7C8798}
.go button:disabled:hover{background:#131A24;color:#7C8798;box-shadow:none}

/* 内容立即可见（不做入场动画，保证任何环境下都可读） */
.fade{}

footer{
  max-width:680px;margin:0 auto;padding:0 24px 70px;
  font-family:Consolas,monospace;font-size:11.5px;color:#3A424E;
  border-top:1px solid var(--line);padding-top:22px;margin-top:40px
}

/* ══════════ 移动端适配 ══════════ */
/* ══════════ 结局：分享卡 + 重玩提示 ══════════ */
.go{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-share{
  background:var(--teal);color:#08110E;border:1px solid var(--teal);
  padding:13px 30px;font-size:15px;border-radius:3px;cursor:pointer;
  font-family:inherit;transition:.18s;font-weight:600
}
.btn-share:hover{background:#7DE8CF;box-shadow:0 0 18px rgba(91,217,190,.35)}
.replay-tip{
  margin:30px auto 0;max-width:520px;padding:16px 20px;
  background:var(--panel);border-left:3px solid var(--amber);
  color:#B8C4D4;font-size:14px;line-height:1.85;border-radius:0 3px 3px 0
}

@media (max-width: 720px){
  body{font-size:16px;line-height:1.95;overflow-x:hidden}
  .page{max-width:100%;padding:34px 18px 100px}
  .topbar{padding:9px 0}
  .topbar-in{max-width:100%;padding:0 14px;gap:8px;flex-wrap:nowrap}
  .tb-title{font-size:12.5px;white-space:nowrap}
  .tb-prog{flex:1;min-width:0;justify-content:center}
  .pips{gap:3px}
  .pip{width:7px}
  .tb-step{font-size:11.5px;white-space:nowrap}
  .tb-hud{font-size:11px;gap:7px;white-space:nowrap}
  .tb-hud b{font-size:12px}
  /* 交互面板：两列改单列 */
  .stage{grid-template-columns:1fr !important}
  .stage canvas{max-width:100%}
  .readout{grid-template-columns:repeat(2,1fr) !important}
  .panel-head{flex-direction:column;align-items:flex-start;gap:6px}
  .ctrl{flex-direction:column;align-items:stretch;gap:6px}
  .ctrl-val{align-self:flex-end}
  /* 对话 */
  .dlg{padding-left:14px;border-left-width:2px}
  .dlg .who{font-size:13px}
  .dlg .say{font-size:15.5px}
  /* 其他 */
  .sys{font-size:12px}
  .scene-head{font-size:11px}
  .choice{padding:12px 14px}
  .go button{padding:13px 28px;font-size:15px}
}

@media (max-width: 420px){
  body{font-size:15.5px}
  .page{padding:28px 14px 90px}
  .tb-title{display:none}
  .tb-step{font-size:11px}
  .readout{grid-template-columns:1fr 1fr !important}
}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <span class="tb-title">第一次放电</span>
    <span class="tb-prog">
      <span class="pips" id="tb-pips"></span>
      <span id="tb-step">序</span>
    </span>
    <span class="tb-hud">
      I_p <b id="h-ip">0.00 MA</b>
      q <b id="h-q">—</b>
      <b id="h-t">T+00:00</b>
    </span>
  </div>
</div>

<div class="page" id="page"></div>

<footer>
  物理依据公开发表文献 · 反应率参数化采用 Bosch–Hale (1992)<br>
  装置与人物为虚构，物理量级取自公开数据
</footer>

<script>
/* ══════════════════════════════════════════════════════════════
   物理模块
   ══════════════════════════════════════════════════════════════ */

const B_G = 34.3827, M_RC2 = 1124656;
const BH = [1.17302e-9, 1.51361e-2, 7.51886e-2, 4.60643e-3,
            1.35000e-2, -1.06750e-4, 1.36600e-5];

function sigmaV_DT(T) {                     // cm³/s
  T = Math.max(T, 0.2);
  const num = T * (BH[1] + T * (BH[3] + T * BH[5]));
  const den = 1 + T * (BH[2] + T * (BH[4] + T * BH[6]));
  const th = T / (1 - num / den);
  const xi = Math.cbrt(B_G * B_G / (4 * th));
  return BH[0] * th * Math.sqrt(xi / (M_RC2 * T * T * T)) * Math.exp(-3 * xi);
}

/* 状态 */
const S = { ip: 0, q: null, t: 0, trust: 50, flags: {} };

/* ══════════════════════════════════════════════════════════════
   渲染工具
   ══════════════════════════════════════════════════════════════ */

const GRID='#141A22', AXIS='#28323E', DIM='#5A6472';
const AMBER='#FFB347', TEAL='#4EC9B0', RUST='#D2694A', PAPER='#E8E2D4';

function setupCanvas(id, h) {
  const cv = document.getElementById(id);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.getBoundingClientRect().width || 600;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w, h };
}

function grid(ctx, w, h, cols=8, rows=4) {
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  for (let i=1;i<cols;i++){const x=w/cols*i;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for (let i=1;i<rows;i++){const y=h/rows*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
}

/* 幕次顺序（用于进度显示） */
const ORDER = ['prologue', 'act1', 'act2', 'act3', 'act4', 'act5', 'act6', 'act7'];

function hud(currentId) {
  document.getElementById('h-ip').textContent = S.ip.toFixed(2) + ' MA';
  document.getElementById('h-q').textContent = S.q == null ? '—' : S.q.toFixed(2);
  const m = String(Math.floor(S.t / 60)).padStart(2, '0');
  const s = String(Math.floor(S.t % 60)).padStart(2, '0');
  document.getElementById('h-t').textContent = 'T+' + m + ':' + s;

  // 进度
  const pips = document.getElementById('tb-pips');
  const step = document.getElementById('tb-step');
  if (pips && currentId) {
    const idx = ORDER.indexOf(currentId);
    pips.innerHTML = ORDER.map((_, i) => {
      if (i < idx) return '<i class="pip done"></i>';
      if (i === idx) return '<i class="pip now"></i>';
      return '<i class="pip"></i>';
    }).join('');
    const label = currentId === 'prologue' ? '序'
                : '第 ' + currentId.replace('act', '') + ' 幕';
    step.textContent = label + (idx >= 0 ? ' · ' + (idx + 1) + '/' + ORDER.length : '');
  }
}

/* ══════════════════════════════════════════════════════════════
   场景数据
   ══════════════════════════════════════════════════════════════ */

const SCENES = {

/* ───────────── 序 ───────────── */
prologue: {
  n: '序', t: '凌晨三点十七分',
  onEnter: () => {                        // 每次进入序章都重置全部状态
    S.ip = 0; S.q = null; S.t = 0;
    S.trust = 50; S.flags = {};
  },
  render: () => `
    <div class="narr fade">
      空调声。很低，低到你已经听不见了。
    </div>
    <div class="narr fade">
      控制室里有六个人。
    </div>
    <div class="narr fade">
      但主控台前只有一个位置。那个位置是你的。
    </div>
    <div class="narr fade">
      后面是值班区。老周靠在椅子上打盹，小吴戴着耳机刷手机，
      还有两个在低声聊昨天的球赛。角落里有人在泡面，
      那股味道一飘过来，你就知道自己今晚大概睡不成了。
    </div>
    <div class="narr fade">
      他们今晚的工作是「<span class="hl">在需要的时候出现</span>」。
    </div>
    <div class="narr fade em">
      而"需要的时候"，通常意味着你已经把事情搞砸了。
    </div>
    <div class="narr fade" style="margin-top:32px">
      白天这台装置要跑正式实验，一天几十炮，一分钟都不能耽误。
      夜里的窗口留给你这种"想试新东西"的人——
      成不成，天亮之前见分晓。
    </div>
    <div class="narr fade" style="margin-top:32px">
      你面前的屏幕上，真空室已经抽到 <span class="hl">10⁻⁸ 毫巴</span>。
      磁场线圈全部就位，绿色指示灯一排排亮着，安静得像假的。
    </div>
    <div class="narr fade">
      值班手册摊在桌上，第一页写着一行字。是手写的，不是印的。
    </div>
    <div class="sys fade">
      「每一次放电，都是一次不可重复的实验。
       跑之前，想清楚你要问什么。」
    </div>
    <div class="narr fade">
      你把这行字看了两遍。然后拿起电话，拨了老陈的号。
    </div>
    <div class="dlg chen fade">
      <div class="who">老陈</div>
      <div class="say">「喂——」</div>
      <div class="act">背景里有电视声。他大概是在沙发上睡着了。</div>
    </div>
    <div class="dlg chen fade">
      <div class="who">老陈</div>
      <div class="say">「哦，是你啊。几点了……」</div>
      <div class="act">停了两秒。</div>
      <div class="say">「行，我醒着呢。你说。」</div>
    </div>

6. 误差   传播不确定度 → 给出带误差的结论</div>

        <h4>为什么每一步都不能跳</h4>

(δB/B)² = (δk/k)² + (δV/V)² + (δwin/win)²

<span class="cm">// 系统误差不可平均，随机误差可 ~1/√N</span></div>

      </div>
    </details>

  `,

const page = document.getElementById('page');

function renderScene(id) {
  const sc = SCENES[id];
  if (!sc) return;
  if (sc.onEnter) sc.onEnter();

  page.innerHTML = `
    <div class="scene-head fade">
      <span class="n">${sc.n}</span>
      <span class="t">${sc.t}</span>
    </div>
    ${sc.render()}
  `;
  hud(id);
  window.scrollTo({ top: 0, behavior: 'instant' });

  // 统一绑定"继续"按钮（交互模块只负责启用/禁用，不覆盖 onclick）
  const btn = page.querySelector('.go button');
  if (btn && sc.next) {
    btn.onclick = () => renderScene(sc.next);
  }

  // 交互钩子（支持函数或全局函数名）
  if (typeof sc.after === 'function') {
    sc.after(sc.next);
  } else if (sc.after && typeof window[sc.after] === 'function') {
    window[sc.after](sc.next);
  }
}

function setupCoils(nextId) {
  const COILS = [
    { id:'PF1',  v:10.02 }, { id:'PF2',  v:9.98 }, { id:'PF3', v:10.01 },
    { id:'PF4',  v:9.41 },  // ★ 坏通道（-5.9%）
    { id:'PF5',  v:10.03 }, { id:'PF6',  v:9.99 }, { id:'PF7', v:10.00 },
    { id:'PF8',  v:10.02 }, { id:'CS1',  v:9.97 }, { id:'CS2', v:10.01 },
    { id:'CS3',  v:10.00 }, { id:'CS4',  v:9.98 },
  ];
  const g = document.getElementById('coil-grid');
  let found = false;
  let tries = 0;

  g.innerHTML = COILS.map((c,i) => {
    const dev = ((c.v - 10) / 10 * 100);
    return `<div class="coil" data-i="${i}">
      <div class="id">${c.id}</div>
      <div class="val">${c.v.toFixed(2)}</div>
      <div class="dv">${dev >= 0 ? '+' : ''}${dev.toFixed(1)}%</div>
    </div>`;
  }).join('');

  g.querySelectorAll('.coil').forEach(el => {
    el.onclick = () => {
      if (found) return;
      tries++;
      const i = parseInt(el.dataset.i, 10);
      const c = COILS[i];
      const dev = (c.v - 10) / 10 * 100;

      if (c.id === 'PF4') {
        found = true;
        el.classList.add('picked');
        document.getElementById('coil-st').textContent = '找到了';
        const cq = document.getElementById('coil-cq');
        cq.className = 'cq warn';
        document.getElementById('coil-cq-s').className = 's warn';
        document.getElementById('coil-cq-s').textContent = '确认偏差';
        document.getElementById('coil-cq-t').innerHTML =
          `PF4 读回 <b>${c.v.toFixed(2)} kA</b>，比设定值低了约 <b>5.9%</b>。<br><br>
           其余 11 路偏差都在 ±0.3% 以内——<b>这是正常的噪声水平</b>。<br><br>
           一个通道单独偏低 6%，这不是噪声。<b>这是标定问题。</b><br>
           <span style="color:var(--dim)">（老陈上周说过：PF4 的探头换过。）</span>`;
        document.getElementById('go-act1').disabled = false;
        S.trust += 15; S.flags.foundPF4 = true;
      } else {
        el.classList.add('wrong');
        const cqs = document.getElementById('coil-cq-s');
        cqs.className = 's warn';
        cqs.textContent = '再看一眼';
        document.getElementById('coil-cq-t').innerHTML =
          `${c.id} 偏差 <b>${dev.toFixed(1)}%</b>——这在正常范围内。` +
          `<br>探头噪声一般就在 ±0.3% 上下。<br>` +
          `<span style="color:var(--dim)">继续找。</span>`;
        setTimeout(() => el.classList.remove('wrong'), 900);
      }
    };
  });
}

    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 48, padR = 18, padT = 24, padB = 40;
    const pw = w - padL - padR, ph = h - padT - padB;

    const tMax = 100;               // 显示 0-100 s
    const I = t => {                 // 电流轨迹
      if (t >= tRamp) return 0.8;
      const x = t / tRamp;
      return 0.8 * (1 - Math.pow(1 - x, 2.2));   // 平滑 S 形
    };
    const X = t => padL + t / tMax * pw;
    const Y = i => padT + (1 - i / 0.9) * ph;

    // 轴
    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT+ph);
    ctx.lineTo(padL+pw, padT+ph); ctx.stroke();

    // 刻度
    ctx.font = '10px Consolas,monospace'; ctx.fillStyle = DIM;
    ctx.textAlign = 'right';
    [0, 0.2, 0.4, 0.6, 0.8].forEach(v => {
      const y = Y(v);
      ctx.fillText(v.toFixed(1), padL - 6, y + 3);
    });
    ctx.textAlign = 'center';
    [0, 25, 50, 75, 100].forEach(t => ctx.fillText(t + 's', X(t), padT + ph + 18));

    // 曲线
    const col = tRamp < 40 ? RUST : tRamp <= 70 ? TEAL : AMBER;
    ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = col;
    for (let t = 0; t <= tMax; t += 0.5) {
      const x = X(t), y = Y(I(t));
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 目标线
    ctx.setLineDash([4,4]); ctx.strokeStyle = 'rgba(232,226,212,.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, Y(0.8)); ctx.lineTo(padL+pw, Y(0.8)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(232,226,212,.5)'; ctx.textAlign = 'left';
    ctx.fillText('0.80 MA', padL + 5, Y(0.8) - 6);

    // 标注
    ctx.fillStyle = col; ctx.font = '600 11.5px Consolas,monospace';
    ctx.fillText(tRamp + ' s 到目标', padL + 5, padT + 10);
  }

  function update() {
    const tR = parseInt(sl.value, 10);
    document.getElementById('ramp-val').textContent = tR + ' s';
    draw(tR);

    // 磁通消耗（相对值）
    const flux = 100 * (0.55 + 0.45 * Math.exp(-tR / 55));
    // 跳跃风险：越快越高（非线性）
    const jump = Math.min(100, Math.pow(Math.max(0, 55 - tR) / 35, 1.6) * 100);
    const left = Math.max(0, 100 - flux);

    document.getElementById('ro-flux').textContent = flux.toFixed(0) + ' %';
    const jEl = document.getElementById('ro-jump');
    jEl.textContent = jump.toFixed(0) + ' %';
    jEl.style.color = jump > 60 ? RUST : jump > 25 ? AMBER : TEAL;
    document.getElementById('ro-left').textContent = left.toFixed(0) + ' %';

    // 后果
    const cq = document.getElementById('ramp-cq');
    const cs = document.getElementById('ramp-cq-s');
    const bar = document.getElementById('ramp-bar');
    const txt = document.getElementById('ramp-cq-t');
    cq.className = 'cq';

    if (tR < 38) {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '风险很高';
      bar.style.background = RUST;
      bar.style.width = jump.toFixed(0) + '%';
      txt.innerHTML = `升得太快了。<b>磁通跳跃风险 ${jump.toFixed(0)}%</b>。<br>
        高电压在超导线圈里容易诱发热失控——那一小段失超之后，
        磁通会"卡"住，等离子体位置就要开始漂。<br>
        <span style="color:var(--dim)">老陈说过：撞一次，检修两周。</span>`;
    } else if (tR <= 72) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '稳';
      bar.style.background = TEAL;
      bar.style.width = Math.max(12, jump).toFixed(0) + '%';
      txt.innerHTML = `这是一个稳妥的选择。<b>磁通跳跃风险降到 ${jump.toFixed(0)}%</b>。<br>
        代价是磁通消耗略高（${flux.toFixed(0)}%），
        但平顶段还有 ${left.toFixed(0)}% 的余量可用。
        <span style="color:var(--dim)">稳，就是快。</span>`;
    } else {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '过于保守';
      bar.style.background = AMBER;
      bar.style.width = '22%';
      txt.innerHTML = `过分谨慎了。<b>${tR} 秒</b>爬升，虽然很安全，
        但磁通消耗已经到 ${flux.toFixed(0)}%，平顶段只剩 ${left.toFixed(0)}%。<br>
        你的 800 毫秒目标可能撑不到。<br>
        <span style="color:var(--dim)">这是个时间与资源的取舍。</span>`;
    }
  }

  sl.addEventListener('input', update);
  update();

  // 只负责"启用"按钮，onclick 由 renderScene 统一绑定
  const btn = document.getElementById('go-act2');
  if (btn) setTimeout(() => { btn.disabled = false; }, 800);
}

/* ══════════════════════════════════════════════════════════════
   交互 3 · q 剖面（电流峰化）
   ══════════════════════════════════════════════════════════════ */

function setupQ(nextId) {
  const sl = document.getElementById('qpeak');
  let cv = null;

  const Q95 = 3.41;

  function q0Of(p) {                       // 峰化 → q(0)
    return Q95 / (1.1 + (p - 1) * 1.3);
  }

  function draw(p) {
    if (!cv) cv = setupCanvas('cv-q', 270);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const q0 = q0Of(p);
    const saw = q0 < 1;                    // 锯齿

    // ── 左：q 剖面 ──
    const LW = w * 0.46;
    const padL = 44, padT = 26, padB = 34;
    const pw = LW - padL - 12, ph = h - padT - padB;

    const X = r => padL + r * pw;
    const Y = q => padT + (1 - Math.min(q, 4.4) / 4.4) * ph;

    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph);
    ctx.lineTo(padL + pw, padT + ph); ctx.stroke();

    ctx.font = '10px Consolas,monospace'; ctx.fillStyle = DIM;
    ctx.textAlign = 'right';
    [0, 1, 2, 3, 4].forEach(v => ctx.fillText(v, padL - 6, Y(v) + 3));

    // q = 1 危险线
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(210,105,74,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, Y(1)); ctx.lineTo(padL + pw, Y(1)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = RUST; ctx.textAlign = 'left';
    ctx.fillText('q = 1', padL + 4, Y(1) - 4);

    // q(r) 曲线（抛物线近似）
    ctx.beginPath(); ctx.lineWidth = 2.6;
    ctx.strokeStyle = saw ? RUST : TEAL;
    for (let r = 0; r <= 1.001; r += 0.02) {
      const q = q0 + (Q95 - q0) * r * r;
      const x = X(r), y = Y(q);
      if (r === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.fillStyle = DIM; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('r / a', padL + pw / 2, padT + ph + 18);
    ctx.textAlign = 'left';
    ctx.fillStyle = saw ? RUST : TEAL;
    ctx.font = '600 11px Consolas,monospace';
    ctx.fillText('q(r) 剖面', padL + 4, padT + 8);

    // ── 右：温度波形（有无锯齿）──
    const RX = LW + 16;
    const rw = w - RX - 14;
    const rh = ph;

    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(RX, padT); ctx.lineTo(RX, padT + rh);
    ctx.lineTo(RX + rw, padT + rh); ctx.stroke();

    ctx.beginPath(); ctx.lineWidth = 2.2;
    ctx.strokeStyle = saw ? RUST : TEAL;
    const tmax = 10;
    for (let t = 0; t <= tmax; t += 0.02) {
      const base = 0.62;
      let v = base;
      if (saw) {
        const per = 0.9 + 2.6 * q0;          // q0 越低，周期越短
        const ph2 = (t % per) / per;
        v = base + 0.20 * ph2 - (ph2 > 0.93 ? 0.30 : 0);
      } else {
        v = base + 0.02 * Math.sin(t * 3.1);
      }
      const x = RX + t / tmax * rw;
      const y = padT + (1 - v / 0.95) * rh;
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.fillStyle = saw ? RUST : TEAL;
    ctx.font = '600 11px Consolas,monospace'; ctx.textAlign = 'left';
    ctx.fillText(saw ? '核心温度：锯齿' : '核心温度：平稳', RX + 4, padT + 8);

    return { q0, saw };
  }

  function update() {
    const p = parseFloat(sl.value);
    document.getElementById('qpeak-val').textContent = p.toFixed(2);
    const { q0, saw } = draw(p);

    document.getElementById('ro-q0').textContent = q0.toFixed(2);
    const st = document.getElementById('ro-qstate');
    st.textContent = saw ? '锯齿' : (q0 < 1.15 ? '临界' : '稳定');
    st.style.color = saw ? RUST : q0 < 1.15 ? AMBER : TEAL;
    const cf = document.getElementById('ro-conf');
    const confDelta = (p - 1) * 8;           // 峰化越高约束越好（简化）
    cf.textContent = (confDelta >= 0 ? '+' : '') + confDelta.toFixed(0) + '%';
    cf.style.color = confDelta > 4 ? TEAL : confDelta < -4 ? AMBER : PAPER;

    // 后果
    const cq = document.getElementById('q-cq');
    const cs = document.getElementById('q-cq-s');
    const tx = document.getElementById('q-cq-t');
    cq.className = 'cq';

    if (saw) {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '核心在抽搐';
      tx.innerHTML = `<b>q(0) = ${q0.toFixed(2)}，低于 1。</b><br>
        右边那条温度曲线开始周期性崩塌——每次崩塌，核心的一小块热量会被甩出去。<br>
        不是致命的。但你的数据里从此多了一个周期性扰动，
        均值和标准差都会被污染。<br>
        <span style="color:var(--dim)">（把峰化度往左拖。）</span>`;
    } else if (q0 < 1.15) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '刚刚脱险';
      tx.innerHTML = `<b>q(0) = ${q0.toFixed(2)}，勉强在 1 以上。</b><br>
        现在没有锯齿了。但这个裕度很薄——只要电流剖面稍微动一下，
        就会掉回危险区。<br>
        <span style="color:var(--dim)">工程上一般会留更大的余量。</span>`;
    } else {
      const confPct = ((p - 1) * 8).toFixed(0);
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '稳';
      tx.innerHTML = `<b>q(0) = ${q0.toFixed(2)}，安全。</b><br>
        核心平稳，没有锯齿。代价是约束稍微降了一点
        （${confPct >= 0 ? '+' : ''}${confPct}%）。<br>
        <span style="color:var(--dim)">老陈说过：你不是在赢，你是在换。</span>`;
    }

    // 稳定后启用按钮
    const btn = document.getElementById('go-act3');
    if (btn && !saw) setTimeout(() => { btn.disabled = false; }, 400);
  }

  sl.addEventListener('input', update);
  update();
}

/* ══════════════════════════════════════════════════════════════
   交互 4 · 加热功率分配
   ══════════════════════════════════════════════════════════════ */

function setupHeat(nextId) {
  const sO = document.getElementById('p-ohm');
  const sR = document.getElementById('p-rf');
  const sN = document.getElementById('p-nbi');
  let cv = null, solved = false;

  /** 求解平衡温度（简化迭代） */
  function solveT(pO, pR, pN) {
    let T = 1.2;
    for (let i = 0; i < 60; i++) {
      // 欧姆效率随温度下降（Spitzer: η ∝ T^-3/2）
      const ohmEff = pO * Math.exp(-T / 7.5);
      const P = ohmEff + pR + pN;
      const Tn = 11.5 * Math.pow(Math.max(P, 0.1) / 26, 0.52);
      T = T + 0.35 * (Tn - T);
      if (Math.abs(Tn - T) < 0.002) break;
    }
    return T;
  }

  function draw(pO, pR, pN, T) {
    if (!cv) cv = setupCanvas('cv-heat', 250);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 8, 4);

    const padL = 30, padR = 16, padT = 28, padB = 46;
    const pw = w - padL - padR, ph = h - padT - padB;

    // 温度柱（对比目标）
    const frac = Math.min(T / 10, 1.35);
    const col = T >= 10 ? TEAL : T >= 6 ? AMBER : RUST;

    // 背景
    ctx.fillStyle = '#131B24';
    ctx.fillRect(padL, padT + ph * 0.4, pw, 26);
    // 目标线
    const tgtX = padL + pw * (1 / 1.35);
    ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tgtX, padT + ph * 0.4 - 16);
    ctx.lineTo(tgtX, padT + ph * 0.4 + 42); ctx.stroke();
    ctx.fillStyle = PAPER; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('目标 10 keV', tgtX, padT + ph * 0.4 - 22);

    // 填充
    ctx.fillStyle = col;
    ctx.fillRect(padL, padT + ph * 0.4, Math.min(frac, 1.35) * pw, 26);

    ctx.textAlign = 'left'; ctx.font = '600 13px Consolas,monospace';
    ctx.fillStyle = col;
    ctx.fillText(T.toFixed(2) + ' keV', padL + 6, padT + ph * 0.4 + 18);

    // 三种加热的堆叠贡献（下方的条）
    const ohmEff = pO * Math.exp(-T / 7.5);
    const items = [
      ['欧姆（有效）', ohmEff, RUST],
      ['射频', pR, AMBER],
      ['中性束', pN, TEAL],
    ];
    const maxP = Math.max(ohmEff + pR + pN, 30);
    let acc = padL;
    items.forEach(([label, val, c]) => {
      const bw = val / maxP * pw;
      ctx.fillStyle = c;
      ctx.fillRect(acc, padT + ph * 0.4 + 52, bw, 12);
      acc += bw;
    });
    // 注释
    ctx.font = '10px Consolas,monospace'; ctx.textAlign = 'left';
    const total = ohmEff + pR + pN;
    let lx = padL;
    items.forEach(([label, val, c]) => {
      if (val > 0.5) {
        ctx.fillStyle = c;
        ctx.fillText(`${label.replace('（有效）','')} ${val.toFixed(1)}`, lx + 2, padT + ph * 0.4 + 80);
        lx += pw / 3;
      }
    });
    ctx.fillStyle = DIM;
    ctx.fillText(`总有效加热 ${total.toFixed(1)} MW`, padL, padT + ph * 0.4 + 100);

    // 顶部：欧姆效率提示
    ctx.fillStyle = RUST; ctx.font = '600 11px Consolas,monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`欧姆效率 ${(Math.exp(-T / 7.5) * 100).toFixed(0)}%`, padL, padT + 8);
  }

  function update() {
    const pO = parseInt(sO.value, 10);
    const pR = parseInt(sR.value, 10);
    const pN = parseInt(sN.value, 10);

    document.getElementById('p-ohm-v').textContent = pO + ' MW';
    document.getElementById('p-rf-v').textContent = pR + ' MW';
    document.getElementById('p-nbi-v').textContent = pN + ' MW';

    const T = solveT(pO, pR, pN);
    draw(pO, pR, pN, T);

    document.getElementById('ro-te').textContent = T.toFixed(2) + ' keV';
    document.getElementById('ro-te').style.color = T >= 10 ? TEAL : T >= 6 ? AMBER : RUST;

    const ohmEff = pO * Math.exp(-T / 7.5);
    document.getElementById('ro-ohmeff').textContent =
      `${ohmEff.toFixed(1)} / ${pO} MW`;

    // 成本：射频和中性束都贵
    const cost = pO * 0.05 + pR * 1.0 + pN * 1.6;
    document.getElementById('ro-cost').textContent = cost.toFixed(1);

    // 后果
    const cq = document.getElementById('heat-cq');
    const cs = document.getElementById('heat-cq-s');
    const bar = document.getElementById('heat-bar');
    const tx = document.getElementById('heat-cq-t');
    cq.className = 'cq';
    bar.style.width = Math.min(T / 10 * 100, 100).toFixed(0) + '%';

    if (T >= 10) {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '达标';
      bar.style.background = TEAL;
      tx.innerHTML = `<b>电子温度 ${T.toFixed(2)} keV</b>——目标达成。<br>
        注意欧姆那一项：它标称 ${pO} MW，实际只贡献了 <b>${ohmEff.toFixed(1)} MW</b>。
        温度越高，它越没用。<br>
        <span style="color:var(--dim)">这就是为什么必须上射频和中性束。</span>`;
      if (!solved) {
        solved = true;
        const btn = document.getElementById('go-act4');
        if (btn) setTimeout(() => { btn.disabled = false; }, 500);
      }
    } else if (T >= 6) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '还差一点';
      bar.style.background = AMBER;
      tx.innerHTML = `温度 ${T.toFixed(2)} keV。方向对了，但还不够。<br>
        <span style="color:var(--dim)">试试多加一点射频或中性束——纯靠欧姆是上不去的。</span>`;
    } else {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '太低';
      bar.style.background = RUST;
      tx.innerHTML = `温度只有 ${T.toFixed(2)} keV。<br>
        光靠欧姆加热，最多也就到 3 keV 左右——<b>它有个天花板</b>。<br>
        <span style="color:var(--dim)">往上推射频和中性束。</span>`;
    }
  }

  [sO, sR, sN].forEach(s => s.addEventListener('input', update));
  update();
}

/* ══════════════════════════════════════════════════════════════
   交互 5 · Mirnov 频谱演化 + 锁定决策
   ══════════════════════════════════════════════════════════════ */

function setupSpectrum(nextId) {
  const sl = document.getElementById('stime');
  let cv = null, decided = false;

  const LOCK_T = 0.70;                 // 超过这个时间比例 → 锁定
  const ampOf = t => 0.8 + 4.8 * Math.pow(t, 2.8);

  function draw(t) {
    if (!cv) cv = setupCanvas('cv-spec', 250);
    const { ctx, w, h } = cv;
    ctx.clearRect(0, 0, w, h);
    grid(ctx, w, h, 10, 4);

    const padL = 46, padR = 16, padT = 26, padB = 36;
    const pw = w - padL - padR, ph = h - padT - padB;

    // 轴
    ctx.strokeStyle = AXIS; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph);
    ctx.lineTo(padL + pw, padT + ph); ctx.stroke();

    const FMAX = 500;
    const X = f => padL + f / FMAX * pw;
    const Y = a => padT + (1 - Math.min(a, 6) / 6) * ph;

    // 刻度
    ctx.font = '10px Consolas,monospace'; ctx.fillStyle = DIM;
    ctx.textAlign = 'right';
    [0, 2, 4, 6].forEach(a => ctx.fillText(a + '%', padL - 6, Y(a) + 3));
    ctx.textAlign = 'center';
    [0, 100, 200, 300, 400, 500].forEach(f =>
      ctx.fillText(f, X(f), padT + ph + 18));

    const locked = t >= LOCK_T;
    const amp = locked ? 4.8 : ampOf(t);
    const f0 = locked ? 205 : 250;          // 锁定后频率下降

    // 背景噪声
    ctx.beginPath(); ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(90,100,114,.55)';
    for (let f = 0; f <= FMAX; f += 2) {
      const n = 0.28 + 0.16 * Math.sin(f * 0.17) + 0.12 * Math.sin(f * 0.41);
      const x = X(f), y = Y(n);
      if (f === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 主峰（高斯）
    const col = amp > 4 ? RUST : amp > 2.2 ? AMBER : TEAL;
    ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = col;
    for (let f = 0; f <= FMAX; f += 1) {
      const wide = locked ? 22 : 15;
      const g = amp * Math.exp(-Math.pow((f - f0) / wide, 2));
      const n = 0.28 + 0.16 * Math.sin(f * 0.17) + 0.12 * Math.sin(f * 0.41);
      const x = X(f), y = Y(n + g);
      if (f === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 标注
    ctx.textAlign = 'left'; ctx.font = '600 11px Consolas,monospace';
    ctx.fillStyle = col;
    ctx.fillText(locked ? `锁定 · ${f0} kHz` : `旋转模 · ${f0} kHz`,
                 padL + 5, padT + 9);
    ctx.fillStyle = DIM; ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('频率 (kHz)', padL + pw / 2, h - 8);

    return { amp, f0, locked };
  }

  function update() {
    const t = parseInt(sl.value, 10) / 100;
    document.getElementById('stime-val').textContent = (t * 0.4).toFixed(2) + ' s';
    const { amp, f0, locked } = draw(t);

    document.getElementById('ro-freq').textContent = f0 + ' kHz';
    document.getElementById('ro-amp').textContent = amp.toFixed(1) + '%';
    const md = document.getElementById('ro-mode');
    md.textContent = locked ? '已锁定' : (amp > 2.2 ? '快速增长' : '缓慢增长');
    md.style.color = locked ? RUST : amp > 2.2 ? AMBER : TEAL;

    const cq = document.getElementById('spec-cq');
    const cs = document.getElementById('spec-cq-s');
    const tx = document.getElementById('spec-cq-t');
    cq.className = 'cq';

    if (locked) {
      cq.classList.add('bad'); cs.className = 's bad'; cs.textContent = '锁定模';
      tx.innerHTML = `<b>它停下来了。</b>频率从 250 kHz 掉到 ${f0} kHz，
        幅度停在 ${amp.toFixed(1)}%。<br>
        这不是"稳住了"——是它<b>不转了</b>。<br>
        锁定模是破裂的强前兆。你现在必须做点什么。`;
    } else if (amp > 2.2) {
      cq.classList.add('warn'); cs.className = 's warn'; cs.textContent = '在长';
      tx.innerHTML = `幅度到了 <b>${amp.toFixed(1)}%</b>，还在长。<br>
        注意频率还稳在 250 kHz——它还在转，那就还有机会。`;
    } else {
      cq.classList.add('good'); cs.className = 's good'; cs.textContent = '留意';
      tx.innerHTML = `幅度 ${amp.toFixed(1)}%，暂时无害。<br>
        但你盯着它是对的——<b>这种峰最麻烦的地方就是它一开始很客气。</b>`;
    }

    // 触发决策
    if (locked && !decided) {
      document.getElementById('spec-actions').style.display = 'block';
    }
  }

  function settle(kind) {
    if (decided) return;
    decided = true;
    document.getElementById('spec-actions').style.display = 'none';
    const box = document.getElementById('spec-result');
    box.style.display = 'block';

    const data = {
      mitigate: {
        cls: 'good', s: '标准操作',
        html: `<div class="cq good" style="margin:0">
          <div class="cq-h"><span class="t">结果</span><span class="s good">已缓解</span></div>
          <div class="cq-t">
          氖气在 0.5 毫秒内注入。等离子体在一场可控的辐射崩塌中结束——
          能量被均匀摊到真空室壁上，而不是集中打在一个点上。<br><br>
          <b>偏滤器最高温度比上次低了 60%。</b><br><br>
          <span style="color:var(--dim)">老陈说过：数据重要，机器更重要——
          机器没了，以后什么都没了。</span>
          </div></div>`,
        trust: 15
      },
      ecrh: {
        cls: 'warn', s: '部分成功',
        html: `<div class="cq warn" style="margin:0">
          <div class="cq-h"><span class="t">结果</span><span class="s warn">多拿了 80 毫秒</span></div>
          <div class="cq-t">
          电子回旋波瞄准磁岛位置，驱动了一小股电流。<br><br>
          模的幅度<b>停止增长</b>了，但没有缩回去——
          它卡在 3.5% 的位置，像一个临界的水滴。<br><br>
          你又多拿到了 80 毫秒的数据，然后等离子体还是缓慢破裂了。<br>
          <span style="color:var(--dim)">比直接放掉好，但不够干净。</span>
          </div></div>`,
        trust: 5
      },
      nothing: {
        cls: 'bad', s: '赌输了',
        html: `<div class="cq bad" style="margin:0">
          <div class="cq-h"><span class="t">结果</span><span class="s bad">破裂</span></div>
          <div class="cq-t">
          磁岛继续长大。<br><br>
          在它的边界触及某条磁面之后，整个约束结构在 <b>1.5 毫秒</b> 内崩塌。
          14 兆焦的能量打进偏滤器。<br><br>
          三处温度传感器报警。这次放电的数据，后半段基本不能用。<br><br>
          <span style="color:var(--dim)">老陈没说话。过了很久他才开口：
          "记录一下。这就是为什么手册里写着'不要赌'。"</span>
          </div></div>`,
        trust: -20
      }
    }[kind];

    box.innerHTML = data.html;
    S.trust += data.trust;
    const btn = document.getElementById('go-act5');
    if (btn) setTimeout(() => { btn.disabled = false; }, 700);
  }

  sl.addEventListener('input', update);
  update();

  document.getElementById('act-mitigate').onclick = () => settle('mitigate');
  document.getElementById('act-ecrh').onclick = () => settle('ecrh');
  document.getElementById('act-nothing').onclick = () => settle('nothing');
}

/* ══════════════════════════════════════════════════════════════
   交互 6 · 六步数据处理流程
   ══════════════════════════════════════════════════════════════ */

function setupData(nextId) {
  let step = 0;
  const stage = document.getElementById('dp-stage');
  const stepLbl = document.getElementById('dp-step');

  // 结果缓存
  const R = {};

  const STEPS = [
    /* 1 标定 */
    () => ({
      title: '标定：把电压变成磁场',
      body: `<p class="hint">
        这一路探头上周刚换过，标定系数存在校准库里。
        应用它——之后所有数字才有物理意义。
      </p>
      <div class="sys" style="margin-bottom:16px">校准库 · M1 通道
────────────────────────
标定系数   <b>0.943 V/T</b>
线性度     R² = 0.9987
标定日期   2026-10-10</div>`,
      btn: '应用标定',
      run: () => { R.cal = 0.943; }
    }),
    /* 2 去噪 */
    () => ({
      title: '去噪：把干净的部分留下来',
      body: `<p class="hint">信号里混着 50 Hz 市电拾取和一些高频噪声。
        选一种处理方式。</p>`,
      choices: [
        ['低通滤波 + 滑动平均', '推荐：去掉拾取，同时不改变低频物理', 'a'],
        ['只做低通滤波', '够用，但随机噪声还在', 'b'],
        ['不处理', '最快，但噪声会污染统计量', 'c'],
      ],
      run: (k) => { R.denoise = k; }
    }),
    /* 3 选窗 */
    () => ({
      title: '选窗：只分析平顶段',
      body: `<p class="hint">
        整条波形里，上升段的变化比平顶段大得多。
        如果整段一起算，均值和标准差会被上升段整个拉歪。
      </p>
      <div class="sys" style="margin-bottom:16px">波形总长 1.20 s
────────────────────────
上升段   0.00 – 0.42 s
平顶段   <b>0.42 – 0.78 s</b>
下降段   0.78 – 1.20 s</div>`,
      btn: '选择平顶段',
      run: () => { R.win = [0.42, 0.78]; }
    }),
    /* 4 统计 */
    () => ({
      title: '统计量：在窗口上算',
      body: `<p class="hint">
        平顶段已经选好了（0.42–0.78 s）。
        在这个窗口上计算统计量。
      </p>`,
      btn: '计算统计量',
      run: () => {
        R.mean = 0.284; R.sd = 0.0031;
        R.min = 0.276; R.max = 0.295;
      }
    }),
    /* 5 频谱 */
    () => ({
      title: '频谱：找出振荡模式',
      body: `<p class="hint">
        对同一段窗口做傅里叶变换。这会告诉你，
        剩下的那些起伏到底是什么。
      </p>`,
      btn: '做 FFT',
      run: () => { R.f0 = 247; R.mode = 'm=2 撕裂模'; }
    }),
    /* 6 误差 */
    () => ({
      title: '误差传播：给出可信的结论',
      body: `<p class="hint">三个误差源，各自的量级已经算出来了。</p>
      <div class="sys" style="margin-bottom:16px">误差来源
────────────────────────
标定系数     1.20%
信号噪声     0.40%
窗口选择     0.90%</div>`,
      btn: '合成误差并给出结论',
      run: () => {
        R.err = Math.sqrt(1.20 ** 2 + 0.40 ** 2 + 0.90 ** 2);   // ≈1.56%
      }
    }),
  ];

  function render() {
    stepLbl.textContent = `第 ${step + 1} / ${STEPS.length} 步`;
    const s = STEPS[step]();

    let html = `<h3 style="font-size:17px;margin-bottom:14px;color:var(--paper)">${s.title}</h3>`;
    html += s.body;

    if (s.choices) {
      html += `<div class="choices" style="margin-top:16px">` +
        s.choices.map(([t, sub, k]) =>
          `<button class="choice" data-k="${k}">${t}<span class="sub">${sub}</span></button>`
        ).join('') + `</div>`;
    } else {
      html += `<div style="margin-top:18px">
        <button class="choice" id="dp-go" style="border-color:var(--amber);color:var(--amber)">
          ${s.btn}</button></div>`;
    }
    html += `<div id="dp-out" style="margin-top:16px"></div>`;
    stage.innerHTML = html;

    if (s.choices) {
      stage.querySelectorAll('[data-k]').forEach(b => {
        b.onclick = () => {
          const k = b.dataset.k;
          s.run(k);
          const msg = k === 'c'
            ? { cls: 'bad', t: '噪声未处理', d: '随机误差会直接进到统计量里。后面误差棒会变宽。' }
            : k === 'b'
            ? { cls: 'warn', t: '基本可用', d: '拾取去掉了，但随机噪声还在。可以接受。' }
            : { cls: 'good', t: '干净', d: '拾取和随机噪声都压下去了，低频物理没被动。' };
          document.getElementById('dp-out').innerHTML =
            `<div class="cq ${msg.cls}" style="margin:0">
               <div class="cq-h"><span class="t">${msg.t}</span>
                 <span class="s ${msg.cls}">${k === 'c' ? '不推荐' : '可以'}</span></div>
               <div class="cq-t">${msg.d}</div></div>`;
          stage.querySelectorAll('[data-k]').forEach(x => x.disabled = true);
          nextBtn();
        };
      });
    } else {
      document.getElementById('dp-go').onclick = () => {
        s.run();
        showResult();
      };
    }
  }

  function showResult() {
    const out = document.getElementById('dp-out');
    const map = {
      0: () => `<div class="cq good" style="margin:0">
        <div class="cq-h"><span class="t">已标定</span><span class="s good">✓</span></div>
        <div class="cq-t">电压 × 0.943 = 磁场。现在单位是 <b>特斯拉</b>。</div></div>`,
      2: () => `<div class="cq good" style="margin:0">
        <div class="cq-h"><span class="t">窗口已选</span><span class="s good">✓</span></div>
        <div class="cq-t">只保留 0.42–0.78 s。上升段被排除在外。</div></div>`,
      3: () => `<div class="readout" style="margin:0">
        <div class="ro"><div class="ro-k">均值 B</div><div class="ro-v">${R.mean.toFixed(3)} T</div></div>
        <div class="ro"><div class="ro-k">标准差</div><div class="ro-v">${R.sd.toFixed(4)} T</div></div>
        <div class="ro"><div class="ro-k">最小</div><div class="ro-v" style="font-size:16px">${R.min.toFixed(3)} T</div></div>
        <div class="ro"><div class="ro-k">最大</div><div class="ro-v" style="font-size:16px">${R.max.toFixed(3)} T</div></div>
      </div>`,
      4: () => `<div class="cq good" style="margin:0">
        <div class="cq-h"><span class="t">主频 ${R.f0} kHz</span><span class="s good">${R.mode}</span></div>
        <div class="cq-t">这个频率对应一个 2 阶撕裂模——和你第五幕看到的那个峰是同一个。</div></div>`,
    };
    out.innerHTML = map[step] ? map[step]() : '';
    if (step === 5) {
      out.innerHTML = `<div class="cq good" style="margin:0">
        <div class="cq-h"><span class="t">最终结论</span><span class="s good">可以交</span></div>
        <div class="cq-t">
          <b>B_θ = ${R.mean.toFixed(3)} ± ${(R.mean * R.err / 100).toFixed(4)} T</b><br>
          （相对误差 ±${R.err.toFixed(2)}%）<br><br>
          主不稳定模：<b>${R.mode}</b>，频率 ${R.f0} kHz<br><br>
          这份数据可以进数据库了。
        </div></div>`;
      const btn = document.getElementById('go-act6');
      if (btn) setTimeout(() => { btn.disabled = false; }, 600);
    } else {
      nextBtn();
    }
  }

  function nextBtn() {
    const out = document.getElementById('dp-out');
    const b = document.createElement('button');
    b.className = 'choice';
    b.style.marginTop = '16px';
    b.style.borderColor = 'var(--amber)';
    b.style.color = 'var(--amber)';
    b.textContent = '下一步 →';
    b.onclick = () => { step++; if (step < STEPS.length) render(); };
    out.appendChild(b);
  }

  render();
}

/* ══════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════ */

renderScene('prologue');
</script>
