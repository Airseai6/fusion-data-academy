name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Puzzle core logic tests
        run: node --test tests/brain_hub_logic_test.mjs tests/balance_logic_test.mjs tests/sudoku_logic_test.mjs tests/nonogram_logic_test.mjs tests/euler_logic_test.mjs tests/monty_logic_test.mjs tests/nim_logic_test.mjs tests/hanoi_logic_test.mjs tests/fifteen_logic_test.mjs tests/twentyfour_logic_test.mjs tests/river_logic_test.mjs tests/fox_logic_test.mjs tests/fusion_logic_test.mjs

      - name: Run E2E
        run: python tests/e2e_test.py --root .

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            tests/
          retention-days: 7

  # 发布闸门：E2E 红灯则不部署（GitHub Pages 分支部署是自动的，
  # 这一 job 的作用是让红灯在 PR 上可见、阻断「以为能发」）
  gate:
    needs: playtest
    runs-on: ubuntu-latest
    steps:
      - name: E2E passed
        run: echo "✓ E2E green — safe to publish"

