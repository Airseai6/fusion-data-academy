<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>抓狐狸 · 3 分钟脑力闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0F14; --panel:#141A22; --line:#232C38; --line2:#3A4757;
  --ink:#E8EDF4; --dim:#96A5B8; --dim2:#7A8798;
  --fox:#FF8A4C; --ok:#4ADE80; --bad:#F87171; --accent:#60A5FA;
}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; padding:24px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:780px}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:28px;
  gap:12px;flex-wrap:wrap;
}
.ep{font-size:13px;color:var(--dim);letter-spacing:.1em;font-family:Consolas,monospace}
.ep b{color:var(--fox)}
.day{font-size:13px;font-family:Consolas,monospace;color:var(--dim)}
.day b{color:var(--ink);font-size:15px}
.day.warn b{color:var(--bad)}

.title{font-size:26px;font-weight:700;margin-bottom:10px;letter-spacing:.02em}
.subtitle{font-size:14.5px;color:#A8B6C8;line-height:1.9;margin-bottom:26px}

.rules{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:18px 20px;margin-bottom:26px;font-size:14.5px;line-height:2;color:#D6DEE8;
}
.rules .r{display:flex;gap:10px;align-items:flex-start}
.rules .n{
  flex:0 0 20px;height:20px;border-radius:50%;
  background:var(--line);color:var(--dim);
  font-size:11px;display:flex;align-items:center;justify-content:center;
  margin-top:4px;font-family:Consolas,monospace;
}
.rules b{color:var(--fox)}

/* ── 洞 ── */
.stage{
  display:flex;justify-content:center;align-items:center;gap:18px;
  padding:48px 16px;margin-bottom:12px;flex-wrap:wrap;
  position:relative;min-height:180px;
}
.stage.ring{position:relative;height:340px;padding:0;margin-bottom:20px}
.hole{
  width:86px;height:86px;border-radius:50%;
  background:#1B2430;border:2px solid var(--line2);
  box-shadow:inset 0 3px 14px rgba(0,0,0,.55);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--dim);font-family:Consolas,monospace;
  transition:transform .12s,border-color .15s,background .15s;
  position:relative;flex:0 0 auto;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.hole:hover{border-color:var(--accent);transform:scale(1.06);
  box-shadow:inset 0 3px 14px rgba(0,0,0,.4),0 0 18px rgba(96,165,250,.25)}
.hole:active{transform:scale(.97)}
/* 查过 = 历史标记，但仍可再点 */
.hole.checked{border-color:var(--bad);background:rgba(248,113,113,.10);color:var(--bad)}
.hole.has-fox{border-color:var(--fox);background:rgba(255,138,76,.12)}
.hole .fox-ic{font-size:34px;line-height:1}
.hole .ghost{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:28px;opacity:.30;
}
.hole .num{position:absolute;bottom:-22px;font-size:12px;color:#8D9AAC;font-weight:600}
.ring .hole{position:absolute}
.ring-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:12px;color:var(--dim2);text-align:center;line-height:1.7;
  font-family:Consolas,monospace;pointer-events:none;
}

/* ── 状态 ── */
.status{
  min-height:52px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:15px;line-height:1.7;
  padding:14px;margin-bottom:18px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);
}
.status.ok{border-color:var(--ok);color:var(--ok);background:rgba(74,222,128,.07)}
.status.bad{border-color:var(--bad);color:var(--bad);background:rgba(248,113,113,.07)}
.status b{color:var(--fox)}

/* ── 按钮 ── */
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
button{
  font-family:inherit;font-size:14px;padding:12px 28px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;
}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--fox);border-color:var(--fox);color:#180D06;font-weight:600}
button.primary:hover:not(:disabled){background:#FFA06E}
button:disabled{opacity:.35;cursor:not-allowed}
button.small{padding:9px 18px;font-size:13px}

/* ── 跨页链接 / CTA ── */
.btns a{
  font-family:inherit;font-size:14px;padding:12px 26px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  text-decoration:none;transition:.15s;display:inline-block;
}
.btns a:hover{border-color:var(--accent)}
.btns a.primary{background:var(--fox);border-color:var(--fox);color:#180D06;font-weight:600}
.btns a.primary:hover{background:#FFA06E}
.cta-line{
  margin-top:24px;text-align:center;font-size:13.5px;color:#8FA0B5;line-height:1.9
}
.cta-line b{color:var(--fox)}

/* ── 系列入口卡片 ── */
.series{
  display:block;margin-bottom:22px;padding:16px 18px;border-radius:10px;
  background:linear-gradient(135deg,rgba(96,165,250,.10),rgba(96,165,250,.02));
  border:1px solid rgba(96,165,250,.35);text-decoration:none;transition:.15s;
}
.series:hover{border-color:var(--accent);transform:translateY(-1px)}
.series .series-k{
  display:block;font-size:11px;letter-spacing:.12em;color:var(--accent);
  font-family:Consolas,monospace;margin-bottom:6px;
}
.series .series-t{display:block;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:5px}
.series .series-d{display:block;font-size:13px;color:var(--dim);line-height:1.8}

.hint{
  margin-top:22px;padding:16px 18px;border-radius:8px;
  background:rgba(96,165,250,.06);border-left:3px solid var(--accent);
  font-size:13.5px;line-height:1.95;color:#B8C6D8;
}
.hint b{color:var(--accent)}
.hint.warn{background:rgba(255,138,76,.07);border-left-color:var(--fox)}
.hint.warn b{color:var(--fox)}

/* ── 序列编辑（第二关）── */
.seqbox{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:18px 20px;margin-bottom:18px;
}
.seqbox .lab{font-size:12px;color:var(--dim2);margin-bottom:10px;font-family:Consolas,monospace;letter-spacing:.08em}
.seq{
  display:flex;gap:8px;flex-wrap:wrap;min-height:44px;align-items:center;
  padding:10px;background:#0E141B;border-radius:6px;
  font-family:Consolas,monospace;font-size:16px;
}
.seq .chip{
  padding:6px 14px;border-radius:4px;background:rgba(255,138,76,.15);
  color:var(--fox);border:1px solid rgba(255,138,76,.35);font-weight:600;
}
.seq .empty{color:var(--dim2);font-size:13px}

/* ── 判定结果 ── */
.verdict{
  margin-top:18px;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);
}
.verdict .head{padding:14px 18px;font-size:15px;font-weight:600;text-align:center}
.verdict.pass .head{background:rgba(74,222,128,.12);color:var(--ok);border-bottom:1px solid rgba(74,222,128,.3)}
.verdict.fail .head{background:rgba(248,113,113,.12);color:var(--bad);border-bottom:1px solid rgba(248,113,113,.3)}
.verdict table{width:100%;border-collapse:collapse;font-size:13px}
.verdict td{
  padding:9px 18px;border-bottom:1px solid var(--line);
  font-family:Consolas,monospace;
}
.verdict td:first-child{color:var(--dim);width:130px}
.verdict tr:last-child td{border-bottom:none}
.verdict .caught{color:var(--ok)}
.verdict .escaped{color:var(--bad)}

/* ── 结局 ── */
.ending{text-align:center;padding:20px 0}
.ending h2{font-size:22px;margin-bottom:18px}
.ending .big{font-size:44px;margin:10px 0 22px}
.ending p{font-size:14.5px;line-height:2.1;color:#B8C6D8;margin-bottom:16px;text-align:left}
.ending .hl{color:var(--fox);font-weight:600}
.mathbox{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:18px 20px;margin:22px 0;text-align:left;
  font-family:Consolas,monospace;font-size:13px;line-height:2;color:#9FB0C4;
}
.mathbox .k{color:var(--fox)}
.mathbox .g{color:var(--ok)}

@media (max-width:560px){
  body{padding:16px 12px 50px}
  .title{font-size:22px}
  .stage{gap:10px;padding:38px 4px}
  .hole{width:62px;height:62px}
  .hole .fox-ic{font-size:24px}
  .hole .ghost{font-size:20px}
  .ring{height:290px}
  .ring .hole{width:58px;height:58px}
  .hole .num{font-size:10px;bottom:-18px}
  .seq{font-size:14px}
  .seq .chip{padding:5px 10px}
  .verdict td{padding:8px 12px;font-size:12px}
  .verdict td:first-child{width:100px}
}
</style>
<script src="../analytics.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ══════════════════════════════════════════════════════════
   图工具
   ══════════════════════════════════════════════════════════ */
function neighbors(i, n, cyclic) {
  const out = [];
  if (i > 0) out.push(i - 1);
  if (i < n - 1) out.push(i + 1);
  if (cyclic) {
    if (i === 0) out.push(n - 1);
    if (i === n - 1) out.push(0);
  }
  return [...new Set(out)];
}

function dist(a, b, n, cyclic) {
  return cyclic
    ? Math.min(Math.abs(a - b), n - Math.abs(a - b))
    : Math.abs(a - b);
}

/* 狐狸的固定逃脱策略：远离最近一次查询位置 */
function foxEscape(fox, check, n, cyclic) {
  const nbs = neighbors(fox, n, cyclic);
  nbs.sort((a, b) => dist(b, check, n, cyclic) - dist(a, check, n, cyclic));
  return nbs[0];
}

/* ══════════════════════════════════════════════════════════
   核心：判定一个查询序列能否【保证】抓到
   ══════════════════════════════════════════════════════════
   做法：可能性集合演化（对最坏情况成立）
   - 每一步：删掉被查的位置；若集合空了 → 保证抓到
   - 然后按邻接关系演化集合
   - 序列走完集合仍非空 → 不能保证
   ══════════════════════════════════════════════════════════ */
function evaluateSequence(seq, n, cyclic) {
  let poss = new Set([...Array(n).keys()]);
  const trace = [];

  for (let d = 0; d < seq.length; d++) {
    const c = seq[d];
    poss.delete(c);
    if (poss.size === 0) {
      return { guaranteed: true, at: d + 1, trace };
    }
    const nxt = new Set();
    for (const p of poss) for (const q of neighbors(p, n, cyclic)) nxt.add(q);
    poss = nxt;
    trace.push({ day: d + 1, check: c, remain: [...poss] });
  }
  return { guaranteed: false, remaining: [...poss], trace };
}

/* 对每个起始位置，用狐狸策略模拟，找反例 */
function counterExamples(seq, n, cyclic) {
  const rows = [];
  for (let start = 0; start < n; start++) {
    let fox = start;
    let caught = false;
    const path = [fox];
    for (let d = 0; d < seq.length; d++) {
      if (fox === seq[d]) { caught = true; break; }
      fox = foxEscape(fox, seq[d], n, cyclic);
      path.push(fox);
    }
    rows.push({ start, caught, path, final: fox });
  }
  return rows;
}

/* ══════════════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════════════ */
const G = {
  level: 1,
  n: 5,
  cyclic: false,
  day: 1,
  maxDay: 8,
  possible: new Set(),
  fox: 0,
  history: [],
  checked: new Set(),
  phase: 'intro',
  attempts: 0,
  showPossible: true,
  // 第二关：策略模式
  seq: [],
  submissions: 0,
  lastVerdict: null,
};

const MAX_SEQ = 14;

function resetLevel(level) {
  G.level = level;
  G.cyclic = (level === 2);
  G.n = 5;
  G.day = 1;
  G.maxDay = level === 1 ? 8 : 14;   // 统一：L1=8, L2=14
  G.possible = new Set([...Array(G.n).keys()]);
  G.fox = Math.floor(Math.random() * G.n);
  G.history = [];
  G.checked = new Set();
  G.phase = 'intro';
  G.attempts = 0;
  G.showPossible = (level === 1);
  G.seq = [];
  G.submissions = 0;
  G.lastVerdict = null;
}

/* ══════════════════════════════════════════════════════════
   渲染
   ══════════════════════════════════════════════════════════ */
const app = document.getElementById('app');

function render() {
  const map = {
    intro: renderIntro,
    play: renderPlay,
    win: renderWin,
    lose: renderLose,
    reveal: renderReveal,
    strategy: renderStrategy,
    final: renderFinal,
  };
  (map[G.phase] || renderIntro)();
}

function topbar() {
  const left = G.level === 1
    ? '<span class="ep">第一关 · <b>一条线</b></span>'
    : '<span class="ep">第二关 · <b>一个环</b></span>';
  let right = '';
  if (G.level === 1 && (G.phase === 'play' || G.phase === 'intro')) {
    const warn = G.day > G.maxDay - 3 ? ' warn' : '';
    right = `<span class="day${warn}">第 <b>${G.day}</b> 天 / 上限 ${G.maxDay}</span>`;
  } else if (G.level === 2 && G.phase === 'strategy') {
    right = `<span class="day">已提交 <b>${G.submissions}</b> 次</span>`;
  }
  return `<div class="topbar">${left}${right}</div>`;
}

/* ── 说明页 ── */
function renderIntro() {
  if (G.level === 1) {
    app.innerHTML = `
      ${topbar()}
      <div class="title">五个洞，一只狐狸</div>
      <div class="subtitle">她每天只能挪到相邻的洞。你每天能查一个洞。</div>
      <div class="rules">
        <div class="r"><span class="n">1</span><span>狐狸藏在 5 个洞中的某一个</span></div>
        <div class="r"><span class="n">2</span><span>每天你点一个洞「查」—— 如果她在那，你就赢了</span></div>
        <div class="r"><span class="n">3</span><span>没查中的话，当晚她<b>必须</b>挪到相邻的洞</span></div>
        <div class="r"><span class="n">4</span><span>你要在 <b>8 天</b>内抓到她</span></div>
      </div>
      <div class="hint">
        <b>这不是运气题</b>。有一个顺序能<b>保证</b>抓到 —— 不管她怎么躲。<br>
        同一个洞<b>可以查多次</b>（她可能又绕回来）。
      </div>
      <a class="series" href="./digits/">
        <span class="series-k">思维闯关 · 新作</span>
        <span class="series-t">数字侦探 · Bulls &amp; Cows</span>
        <span class="series-d">4 位数字 + 6 次机会，用 A/B 反馈排除候选 →</span>
      </a>
      <a class="series" href="./nim/">
        <span class="series-k">思维闯关 · 第三关</span>
        <span class="series-t">最后一颗 · Nim 取子</span>
        <span class="series-d">三堆石子 + 二进制异或，三档 AI 陪你练必败态 →</span>
      </a>
      <a class="series" href="./hanoi/">
        <span class="series-k">思维闯关 · 第四关</span>
        <span class="series-t">汉诺塔 · 最少步</span>
        <span class="series-d">三根柱子 + 递归，3–6 层，最少步数 2ⁿ−1，提示下一步 →</span>
      </a>
      <a class="series" href="./fifteen/">
        <span class="series-k">思维闯关 · 第五关</span>
        <span class="series-t">十五数码 · 奇偶</span>
        <span class="series-d">3×3 / 4×4 滑块拼图，一步不变量判定这局到底解不解得开 →</span>
      </a>
      <a class="series" href="./24/">
        <span class="series-k">思维闯关 · 第六关</span>
        <span class="series-t">24点 · 限时</span>
        <span class="series-d">4 个数字凑 24，只出有解手牌；分数中间步才是真正的门槛 →</span>
      </a>
      <a class="series" href="./river/">
        <span class="series-k">思维闯关 · 第七关</span>
        <span class="series-t">过河 · 状态图</span>
        <span class="series-d">狼羊菜 / 传教士野人两关，BFS 给出最短步数与状态图统计 →</span>
      </a>
      <a class="series" href="./fox-hunt/">
        <span class="series-k">思维闯关 · 第八关</span>
        <span class="series-t">围堵狐狸 · 顶点割</span>
        <span class="series-d">环图 / 树 / 网格三张路网，狐狸不会失误，AND/OR 搜索证明最少封路步数 →</span>
      </a>
    <a class="series" href="./fusion-stack/">
        <span class="series-k">思维闯关 · 第九关</span>
        <span class="series-t">聚变堆叠 · 能量阶梯</span>
        <span class="series-d">2048 式滑动合并，每步都是真实聚变的 Q 值；铍-8 那一步几乎不放能 →</span>
      </a>
      <a class="series" href="./balance/">
        <span class="series-k">思维闯关 · 第十关</span>
        <span class="series-t">天平称币 · 3 次锁定</span>
        <span class="series-d">12 枚金币 1 枚假币，3 次称重把 24 种可能压到 1 种 →</span>
      </a>
      <a class="series" href="./sudoku/">
        <span class="series-k">思维闯关 · 第十一关</span>
        <span class="series-t">迷你数独 · 4×4</span>
        <span class="series-d">4×4 数独，每行每列每宫 1–4；唯一解生成，一局 3 分钟 →</span>
      </a>
      <a class="series" href="./nonogram/">
        <span class="series-k">思维闯关 · 第十二关</span>
        <span class="series-t">数织 · 5×5 图像</span>
        <span class="series-d">用行/列数字线索，把隐藏的 5×5 图案一点点推出来 →</span>
      </a>
      <a class="series" href="./euler/">
        <span class="series-k">思维闯关 · 第十三关</span>
        <span class="series-t">一笔画 · 七桥突围</span>
        <span class="series-d">每条边只走一次；数奇度点，判断欧拉路径到底存不存在 →</span>
      </a>
      <a class="series" href="./monty/">
        <span class="series-k">思维闯关 · 第十四关</span>
        <span class="series-t">三门问题 · 换门挑战</span>
        <span class="series-d">换还是不换？跑 1000 局，看换门 67% 的胜率 →</span>

    `;
  } else {
    app.innerHTML = `
      ${topbar()}
      <div class="title">这次不靠运气</div>
      <div class="subtitle">第二关要你<b>证明</b>一个策略。</div>
      <div class="rules">
        <div class="r"><span class="n">1</span><span>五个洞现在<b>首尾相连</b>（1 号和 5 号相邻）</span></div>
        <div class="r"><span class="n">2</span><span>你不再逐天点击，而是<b>组一条查询序列</b></span></div>
        <div class="r"><span class="n">3</span><span>提交后，程序会穷举她所有可能的起点，看你这套顺序能不能<b>保证</b>抓到</span></div>
        <div class="r"><span class="n">4</span><span>最多 14 步</span></div>
      </div>
      <div class="hint warn">
        提示：第一关那个"扫两遍"的办法，在这里可能不管用。
      </div>
      <div class="btns">
        <button class="primary" onclick="startStrategy()">开始组策略</button>
        <button onclick="resetLevel(1);render()">回第一关</button>
      </div>
    `;
  }
}

/* ── 第一关：逐日玩 ── */
function startPlay() {
  if (window.counters) counters.track('puzzle_l1_start');
  G.phase = 'play';
  G.possible = new Set([...Array(G.n).keys()]);
  G.fox = Math.floor(Math.random() * G.n);
  G.day = 1;
  G.checked = new Set();
  G.history = [];
  render();
}

function ringPos(i) {
  const R = 108, half = 43;
  const ang = (Math.PI * 2 * i / G.n) - Math.PI / 2;
  const x = Math.cos(ang) * R, y = Math.sin(ang) * R;
  return `left:calc(50% + ${x.toFixed(1)}px - ${half}px);top:calc(50% + ${y.toFixed(1)}px - ${half}px)`;
}

function holeEl(i, opts) {
  opts = opts || {};
  const isChecked = opts.markChecked !== false && G.checked.has(i);
  const showFox = opts.showFox && G.fox === i;
  const ghost = opts.showGhost && G.showPossible && G.history.length > 0 && G.possible.has(i);
  const cls = ['hole'];
  if (isChecked) cls.push('checked');
  if (showFox) cls.push('has-fox');

  let inner = '';
  if (showFox) inner += '<span class="fox-ic">🦊</span>';
  else if (ghost) inner += '<span class="ghost">🦊</span>';

  const style = (G.cyclic && opts.ring) ? ringPos(i) : '';
  return `<div class="${cls.join(' ')}" data-i="${i}" style="${style}">${inner}<span class="num">${i + 1}</span></div>`;
}

function renderPlay() {
  const opts = { showGhost: true, showFox: false, markChecked: true };
  const holes = [...Array(G.n).keys()].map(i => holeEl(i, opts)).join('');
  const stageCls = G.cyclic ? 'stage ring' : 'stage';
  const center = G.cyclic ? `<div class="ring-center">1 ↔ 5<br>相连</div>` : '';

  let status;
  if (G.history.length === 0) {
    status = `点一个洞开始查。<b>还有 5 个洞，她可能在任何一个。</b>`;
  } else {
    const last = G.history[G.history.length - 1];
    status = `第 ${G.day - 1} 天查了 <b>${last + 1} 号洞</b> —— 空的。她跑了。<br>
              <span style="font-size:13px;color:var(--dim2)">半透明的狐狸 = 她可能的位置</span>`;
  }

  app.innerHTML = `
    ${topbar()}
    <div class="${stageCls}">${holes}${center}</div>
    <div class="status">${status}</div>
    <div class="btns">
      <button class="small" onclick="resetLevel(1);render()">重来</button>
    </div>
  `;

  app.querySelectorAll('.hole').forEach(el => {
    el.onclick = () => onCheck(parseInt(el.dataset.i));
  });
}

function onCheck(i) {
  if (G.phase !== 'play') return;
  if (window.counters) counters.track('puzzle_l1_check', { day: G.day, hole: i + 1 });

  // ★ 允许重复查：没有任何 disabled / early return
  G.history.push(i);
  G.checked.add(i);          // 只是视觉历史标记

  // 查中？
  if (G.fox === i) {
    if (window.counters) counters.track('puzzle_l1_win', { days: G.history.length });
    G.phase = 'win';
    render();
    return;
  }

  // 没中 → 狐狸逃
  G.fox = foxEscape(G.fox, i, G.n, G.cyclic);

  // 可能性集合演化
  G.possible.delete(i);
  const nxt = new Set();
  for (const p of G.possible) for (const q of neighbors(p, G.n, G.cyclic)) nxt.add(q);
  G.possible = nxt;

  G.day++;

  if (G.day > G.maxDay) {
    if (window.counters) counters.track('puzzle_l1_dead', { day: G.day });
    G.phase = 'lose';
    G.attempts++;
    render();
    return;
  }
  render();
}

/* ── 第二关：策略模式 ── */
function startStrategy() {
  if (window.counters) counters.track('puzzle_l2_start');
  G.phase = 'strategy';
  G.seq = [];
  G.lastVerdict = null;
  render();
}

function pickHole(i) {
  if (G.phase !== 'strategy') return;
  if (G.seq.length >= MAX_SEQ) return;
  G.seq.push(i);
  G.lastVerdict = null;
  render();
}

function undoSeq() {
  G.seq.pop();
  G.lastVerdict = null;
  render();
}

function clearSeq() {
  G.seq = [];
  G.lastVerdict = null;
  render();
}

function submitSeq() {
  if (G.seq.length === 0) return;
  G.submissions++;
  if (window.counters) counters.track('puzzle_l2_submit', { subs: G.submissions, len: G.seq.length });
  const v = evaluateSequence(G.seq, G.n, G.cyclic);
  const rows = counterExamples(G.seq, G.n, G.cyclic);
  G.lastVerdict = { ...v, rows };
  render();
}

function renderStrategy() {
  const holes = [...Array(G.n).keys()].map(i =>
    `<div class="hole" data-i="${i}" style="${ringPos(i)}"><span class="num">${i + 1}</span></div>`
  ).join('');

  const chips = G.seq.length
    ? G.seq.map((x, k) => `<span class="chip">${x + 1}</span>`).join('')
    : '<span class="empty">还没选 —— 点下面的洞加入序列</span>';

  let verdictHtml = '';
  if (G.lastVerdict) {
    const v = G.lastVerdict;
    if (v.guaranteed) {
      verdictHtml = `
        <div class="verdict pass">
          <div class="head">✓ 这个序列能保证抓到（第 ${v.at} 步）</div>
        </div>`;
    } else {
      const escaped = v.rows.filter(r => !r.caught);
      const rows = v.rows.map(r => `
        <tr>
          <td>她从 ${r.start + 1} 号开始</td>
          <td class="${r.caught ? 'caught' : 'escaped'}">
            ${r.caught
              ? '被抓 ✓'
              : `逃脱 ✗　路线 ${r.path.map(x => x + 1).join('→')}`}
          </td>
        </tr>`).join('');
      verdictHtml = `
        <div class="verdict fail">
          <div class="head">✗ 不能保证 —— 有 ${escaped.length} 个起点会逃脱</div>
          <table>${rows}</table>
        </div>`;
    }
  }

  const canSubmit = G.seq.length > 0;

  app.innerHTML = `
    ${topbar()}
    <div class="title">组一条查询序列</div>
    <div class="subtitle">点洞加入序列（可重复）。提交后程序会穷举她的所有起点，检验能否<b>保证</b>抓到。</div>

    <div class="stage ring">${holes}<div class="ring-center">1 ↔ 5<br>相连</div></div>

    <div class="seqbox">
      <div class="lab">你的序列（${G.seq.length} / ${MAX_SEQ} 步）</div>
      <div class="seq">${chips}</div>
    </div>

    <div class="btns">
      <button class="small" onclick="undoSeq()" ${G.seq.length ? '' : 'disabled'}>撤销</button>
      <button class="small" onclick="clearSeq()" ${G.seq.length ? '' : 'disabled'}>清空</button>
      <button class="primary" onclick="submitSeq()" ${canSubmit ? '' : 'disabled'}>提交检验</button>
    </div>

    ${verdictHtml}

    ${G.submissions >= 1 && !(G.lastVerdict && G.lastVerdict.guaranteed) ? `
      <div class="hint warn">
        换一条试试。你已经试了 <b>${G.submissions}</b> 次。
        ${G.submissions >= 2 ? '<br>如果三条都不行 —— 可能不是你的顺序问题。' : ''}
      </div>` : ''}

    <div class="btns" style="margin-top:22px">
      ${G.submissions >= 3 ? '<button onclick="goReveal()">我想知道真相</button>' : ''}
      <button class="small" onclick="resetLevel(1);render()">回第一关</button>
    </div>
  `;

  app.querySelectorAll('.hole').forEach(el => {
    el.onclick = () => pickHole(parseInt(el.dataset.i));
  });
}

/* ── 结局 ── */
function renderWin() {
  const days = G.history.length;
  app.innerHTML = `
    ${topbar()}
    <div class="ending">
      <div class="big">🦊</div>
      <h2>抓到了 —— 用了 ${days} 天</h2>
      <p>现在回想一下你的顺序，是不是接近 <span class="hl">2 → 3 → 4 → 2 → 3 → 4</span>？</p>
      <p>如果是，你已经摸到了那个"保证"的策略。<br>
         如果不是，你也赢了 —— 但可能是运气。</p>
      <div class="mathbox">
        5 个洞的最优策略：<span class="k">2,3,4,2,3,4</span>（6 步，保证抓到）<br>
        通式：n 个洞 → <span class="k">2n − 4</span> 步<br>
        原理：先从 2 号推到 4 号，再推回来 —— 像梳子一样梳两遍。
      </div>
      <p>那如果……<b>洞是首尾相连的呢？</b></p>
    </div>
    <div class="btns"><button class="primary" onclick="goLevel2()">进入第二关</button></div>
  `;
}

function renderLose() {
  const days = G.history.length;
  app.innerHTML = `
    ${topbar()}
    <div class="ending">
      <h2>八天到了，她还在里面</h2>
      <p>你查了 ${days} 次。这一关是<b>有解</b>的 —— 但不是靠猜。</p>
      <div class="hint">
        <b>换个思路</b>：从 2 号开始，一路推到 4 号，<b>然后再从 4 号推回 2 号</b>。<br>
        注意：同一个洞可以查两次。
      </div>
    </div>
    <div class="btns"><button class="primary" onclick="resetLevel(1);render()">再试一次</button></div>
  `;
}

function goReveal() {
  if (window.counters) counters.track('puzzle_reveal_view', { subs: G.submissions });
  G.phase = 'reveal';
  render();
}

function renderReveal() {
  app.innerHTML = `
    ${topbar()}
    <div class="ending">
      <h2>这道题，没有解</h2>
      <div class="big">🚫</div>
      <p>你刚提交的每一条序列，都会留下至少一个逃掉的起点。</p>
      <p><span class="hl">不管你怎么查，都不可能保证抓到她。</span></p>
      <p>原因很简单：环上没有"端点"。</p>
      <div class="mathbox">
        一条线上，你可以从一端把她<b>往另一端的死角挤</b>。<br>
        —— 所以她无处可躲。<br><br>
        但在环上，<span class="k">她永远有"另一边"</span>。<br>
        你从左边推，她往右边跑；你绕过去，她又绕回来。<br><br>
        数学上：<span class="g">环 C_n（n ≥ 3）无必胜策略</span><br>
        线上：<span class="g">路径 P_n 有必胜策略，2n − 4 步</span>
      </div>
      <p><b>但如果你能堵住一个洞呢？</b><br>环就断成了一条线 —— 又回到第一关。</p>
    </div>
    <div class="btns">
      <button onclick="startStrategy();">再试一次（明知无解）</button>
      <button class="primary" onclick="goFinal()">继续</button>
    </div>
    <div class="btns" style="margin-top:18px">
      <a class="primary" href="../lab/">去玩物理版：从零理解核聚变 →</a>
    </div>
    <div class="cta-line">
      关注公众号 <b>「楠楠北北的大转盘」</b> 回复 <b>「聚变」</b> 拿 20 集目录
    </div>
    <div style="text-align:center;margin-top:18px;font-size:13px">
      <a href="../brain/" style="color:#FFB347;border-bottom:1px solid rgba(255,179,71,.3);text-decoration:none">← 回大脑保健操</a>
      <span style="color:#3A4757;margin:0 10px">|</span>
      <a href="./digits/" style="color:#5BD9BE;border-bottom:1px solid rgba(91,217,190,.3);text-decoration:none">玩《数字侦探》→</a>
    </div>
  `;
}

function goFinal() {
  G.phase = 'final';
  render();
}

function renderFinal() {
  app.innerHTML = `
    <div class="ending">
      <div class="big">🧠</div>
      <h2>你刚刚撞上的，是一堵数学的墙</h2>
      <p>这不是设计缺陷，也不是你不够聪明。<br>
         这是图论里一个真实存在的结论：</p>
      <div class="mathbox">
        <span class="k">Hunt the Rabbit</span> / <span class="k">Princess and Monster</span><br><br>
        路径图 → 恒有必胜策略（2n − 4 步）<br>
        环  图 → n ≥ 3 时，<span class="g">永远抓不到</span>
      </div>
      <p>下一集：如果给你<b>两个</b>猎人呢？</p>
    </div>
    <div class="btns">
      <button class="primary" onclick="resetLevel(1);render()">从头再玩一次</button>
      <button onclick="resetLevel(2);startStrategy()">回第二关</button>
    </div>
    <div class="btns" style="margin-top:18px">
      <a class="primary" href="../lab/">去玩物理版：从零理解核聚变 →</a>
    </div>
    <div class="cta-line">
      关注公众号 <b>「楠楠北北的大转盘」</b> 回复 <b>「聚变」</b> 拿 20 集目录

      <span style="color:#3A4757;margin:0 10px">|</span>

    </div>
  `;
}

function goLevel2() {
  resetLevel(2);          // ★ 统一走 resetLevel，maxDay/attempts 全部重置
  G.phase = 'intro';
  render();
}

/* ══════════════════════════════════════════════════════════
   启动（?level=2 也走同一套初始化）
   ══════════════════════════════════════════════════════════ */
(function boot() {
  const q = new URLSearchParams(location.search);
  if (q.get('level') === '2') {
    resetLevel(2);
    G.phase = 'intro';     // 不跳过说明页
  } else if (q.get('level') === '2play') {
    resetLevel(2);
    startStrategy();       // 调试用：直接进策略界面
  } else {
    resetLevel(1);
  }
  render();
})();
</script>
